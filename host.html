<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6f9">
<meta name="color-scheme" content="light">
<meta name="description" content="익스퀴즈 출제자 콘솔 — 문항 관리, 시험 진행, 실시간 결과 대시보드">
<title>익스퀴즈 · 출제자</title>
<style>
/* ==========================================================================
   익스퀴즈 — 스타일 (외부 리소스 0)
   ========================================================================== */
:root{
  --bg:#f4f6f9;
  --bg-grad-1:#eef3ff;
  --bg-grad-2:#f7f4ff;
  --card:#ffffff;
  --ink:#1a2233;
  --ink-soft:#3d4757;
  --muted:#78849a;
  --line:#e8ebf1;
  --line-soft:#f0f2f7;
  --accent:#3b6ef6;
  --accent-dark:#2f59c9;
  --accent-soft:#eaf0ff;
  --ok:#0ea36b;
  --ok-soft:#e6f7ef;
  --warn:#e08c14;
  --warn-soft:#fdf3e1;
  --danger:#e2504a;
  --danger-soft:#fdecea;
  --radius:16px;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 10px 28px -12px rgba(16,24,40,.16);
  --shadow-lift:0 2px 4px rgba(16,24,40,.05), 0 18px 36px -18px rgba(16,24,40,.24);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1100px 520px at 12% -12%, var(--bg-grad-1) 0%, rgba(238,243,255,0) 62%),
    radial-gradient(900px 480px at 92% -6%, var(--bg-grad-2) 0%, rgba(247,244,255,0) 58%),
    var(--bg);
  background-attachment:fixed;
  color:var(--ink);
  font-family:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  font-size:15px;
  line-height:1.5;
  min-height:100vh;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;}
a{color:var(--accent-deep,#2f59c9);}
::placeholder{color:#a3adbf;}
[hidden]{display:none !important;}

/* ── 공통 ───────────────────────────────────────────── */
.app{min-height:100vh;display:flex;flex-direction:column;}
.shell{width:100%;max-width:1080px;margin:0 auto;padding:22px 20px 90px;flex:1 0 auto;}
.muted{color:var(--muted);}
.nowrap{white-space:nowrap;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}

/* 상단 바 */
.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:11px 20px;
  background:rgba(255,255,255,.88);
  -webkit-backdrop-filter:saturate(1.4) blur(12px);
  backdrop-filter:saturate(1.4) blur(12px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.brand-mark{
  width:34px;height:34px;flex:0 0 auto;border-radius:11px;
  background:linear-gradient(135deg,#3b6ef6 0%,#7a5cf0 100%);
  color:#fff;display:grid;place-items:center;
  font-weight:800;font-size:15px;letter-spacing:-.02em;
  box-shadow:0 7px 16px -8px rgba(59,110,246,.9);
}
.brand-text{display:flex;flex-direction:column;min-width:0;line-height:1.25;}
.brand-text strong{font-size:14.5px;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.brand-sub{
  font-size:12px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44vw;
}
.top-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto;}
.sync-badge{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11.5px;font-weight:650;color:#5b6577;
  background:#f2f5fa;border:1px solid #e3e8f1;border-radius:999px;padding:5px 10px;
  white-space:nowrap;
}
.sync-badge i{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(14,163,107,.14);}
.sync-badge.is-live{color:#087a51;background:var(--ok-soft);border-color:#cfeee0;}
.sync-badge.is-wait{color:#8a6a1e;background:var(--warn-soft);border-color:#f6e3bf;}
.sync-badge.is-poll{color:#8a6a1e;background:var(--warn-soft);border-color:#f6e3bf;}
.sync-badge.is-off{color:#b23a34;background:var(--danger-soft);border-color:#f6cfcb;}

/* HOST_ONLY_START */
/* 페이지 헤드 */
.page-head{
  display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
  margin:6px 0 16px;flex-wrap:wrap;
}
.eyebrow{
  display:inline-flex;align-items:center;gap:7px;
  font-size:12px;font-weight:650;letter-spacing:.02em;color:var(--muted);margin-bottom:7px;
}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.page-head h1{
  margin:0;font-size:25px;line-height:1.25;letter-spacing:-.025em;font-weight:800;
  overflow-wrap:anywhere;
}
.page-head .sub{margin:6px 0 0;font-size:13px;color:var(--muted);}
.head-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.mini-stat{
  display:inline-flex;align-items:baseline;gap:3px;
  font-size:12.5px;color:var(--muted);font-weight:600;
  background:#fff;border:1px solid var(--line);border-radius:11px;padding:7px 11px;box-shadow:var(--shadow-sm);
}
.mini-stat b{font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums;}

/* 탭 */
.tabs{
  display:flex;gap:4px;background:#edf1f8;border:1px solid #e3e9f3;
  padding:4px;border-radius:14px;margin:14px 0 18px;overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}
.tab{
  flex:1 1 0;min-width:max-content;border:0;background:transparent;color:#5b6577;
  font-weight:700;font-size:13.5px;padding:10px 12px;border-radius:11px;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;
  transition:background .15s,color .15s,box-shadow .15s;
}
.tab.is-active{background:#fff;color:var(--ink);box-shadow:var(--shadow-sm);}
.tab-count{
  min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:#e4eaf4;color:#5b6577;
  font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;
}
.tab.is-active .tab-count{background:var(--accent-soft);color:var(--accent-dark);}
.tab.is-live .tab-count{background:var(--accent);color:#fff;}
/* HOST_ONLY_END */

/* 카드 */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow-sm);margin-bottom:16px;overflow:hidden;
}
.card-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:15px 18px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap;
}
.card-head h2{
  margin:0;font-size:14.5px;font-weight:750;letter-spacing:-.015em;
  display:flex;align-items:center;gap:8px;
}
.card-head .hint{font-size:12px;color:var(--muted);font-weight:600;}
.card-body{padding:16px 18px;}
.card-body.tight{padding:0;}
.card-foot{
  padding:13px 18px;border-top:1px solid var(--line-soft);background:#fbfcfe;
  display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;
}
.card-note{
  font-size:12.5px;color:var(--muted);line-height:1.6;
  background:#f8fafd;border:1px solid #edf1f7;border-radius:11px;padding:11px 12px;
}
.card-note b{color:var(--ink-soft);}

/* 버튼 */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:40px;padding:0 14px;border-radius:11px;
  border:1px solid var(--line);background:#fff;color:var(--ink);
  font-weight:650;font-size:14px;box-shadow:var(--shadow-sm);
  transition:background .15s,border-color .15s,transform .06s;white-space:nowrap;
}
.btn:hover{border-color:#d7deea;background:#fbfcff;}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 9px 20px -12px rgba(59,110,246,.9);}
.btn-primary:hover{background:var(--accent-dark);border-color:var(--accent-dark);}
.btn-soft{background:var(--accent-soft);border-color:#d8e3ff;color:var(--accent-dark);}
.btn-soft:hover{background:#e0e9ff;border-color:#c8d9ff;}
.btn-danger{background:#fff8f7;border-color:#f3d3d0;color:#c8413b;}
.btn-danger:hover{background:var(--danger-soft);border-color:#efb8b3;}
.btn-ok{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 9px 20px -12px rgba(14,163,107,.9);}
.btn-ok:hover{background:#0b8b5b;border-color:#0b8b5b;}
.btn-ghost{background:transparent;border-color:transparent;box-shadow:none;color:#5b6577;}
.btn-ghost:hover{background:#f1f4f9;}
.btn-sm{min-height:32px;padding:0 10px;font-size:12.5px;border-radius:9px;}
.btn-lg{min-height:50px;font-size:15.5px;border-radius:13px;font-weight:700;}
.btn-block{width:100%;}
.btn-icon{width:32px;min-height:32px;padding:0;font-size:14px;}
.btn[disabled]{opacity:.45;pointer-events:none;box-shadow:none;}

/* 폼 */
.field{display:flex;flex-direction:column;gap:6px;min-width:0;}
.label{font-size:12.5px;font-weight:650;color:#5b6577;}
.input,.textarea,.select{
  width:100%;min-height:42px;border:1px solid var(--line);border-radius:11px;
  padding:10px 12px;background:#fff;color:var(--ink);outline:none;
  transition:border-color .15s,box-shadow .15s;
}
.input:focus,.textarea:focus,.select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.textarea{min-height:78px;resize:vertical;line-height:1.6;}
.input[readonly]{background:#f8fafd;color:#4b5666;font-size:13px;}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;}
.row > *{flex:1 1 160px;min-width:0;}
.row.tight{gap:8px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.hintline{font-size:12px;color:var(--muted);line-height:1.55;}
.errline{font-size:12.5px;color:var(--danger);font-weight:650;}
.saveline{font-size:11.5px;color:var(--ok);font-weight:700;opacity:0;transition:opacity .3s;margin-left:8px;}
.saveline.on{opacity:1;}

/* 문항 진행 표시 (출제자·팀원 공통) */
.psub{display:block;font-size:11px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap;}

/* pill / tag */
.pill{
  display:inline-flex;align-items:center;gap:6px;border-radius:999px;
  padding:6px 12px;font-size:12.5px;font-weight:700;border:1px solid transparent;white-space:nowrap;
}
.pill .dotp{width:6px;height:6px;border-radius:50%;background:currentColor;}
.pill.is-waiting{background:#f1f4f9;color:#5b6577;border-color:#e3e8f1;}
.pill.is-running{background:var(--accent-soft);color:var(--accent-dark);border-color:#d6e2ff;}
.pill.is-running .dotp{animation:pulse 1.5s infinite;}
.pill.is-ended{background:#eef0f4;color:#3d4757;border-color:#e0e4ec;}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(59,110,246,.5);}
  70%{box-shadow:0 0 0 6px rgba(59,110,246,0);}
  100%{box-shadow:0 0 0 0 rgba(59,110,246,0);}
}
.tag{
  display:inline-flex;align-items:center;gap:4px;border-radius:7px;
  padding:2px 7px;font-size:11px;font-weight:700;line-height:1.6;
  background:#f1f4f9;color:#5b6577;border:1px solid #e6ebf3;white-space:nowrap;
}
.tag-mcq{background:#eef3ff;color:#2f59c9;border-color:#dbe6ff;}
.tag-ox{background:#f6efff;color:#6b3ec9;border-color:#e9dcff;}
.tag-short{background:#e9f8f1;color:#087a51;border-color:#cfeee0;}
.tag-pts{background:#fff6e6;color:#9a6100;border-color:#f8e6c4;}
.tag-virtual{background:#f4f1ff;color:#5b3ec9;border-color:#e5defc;}
.tag-test{background:#eef7ff;color:#1d6fa5;border-color:#d7ebfa;}

/* HOST_ONLY_START */
/* ── 문제 관리 ──────────────────────────────────────── */
.qlist{display:flex;flex-direction:column;}
.qitem{display:flex;gap:12px;padding:14px 18px;border-top:1px solid var(--line-soft);}
.qitem:first-child{border-top:0;}
.qnum{
  width:26px;height:26px;flex:0 0 auto;border-radius:8px;background:#f1f4f9;color:#5b6577;
  font-size:12.5px;font-weight:800;display:grid;place-items:center;margin-top:1px;
  font-variant-numeric:tabular-nums;
}
.qmain{flex:1;min-width:0;}
.qtext{font-size:14.5px;font-weight:650;line-height:1.5;overflow-wrap:anywhere;}
.qmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:7px;font-size:12px;color:var(--muted);}
.qans{color:#087a51;font-weight:700;}
.qacts{display:flex;gap:4px;flex:0 0 auto;align-items:flex-start;}
@media (max-width:640px){
  .qitem{flex-wrap:wrap;}
  .qacts{width:100%;justify-content:flex-end;}
}

/* 문항 편집기 */
.typechips{display:flex;gap:6px;flex-wrap:wrap;}
.tchip{
  min-height:36px;padding:0 13px;border-radius:10px;border:1px solid var(--line);
  background:#fff;font-size:13px;font-weight:650;color:#5b6577;
}
.tchip.is-on{background:var(--accent-soft);border-color:#c9d9ff;color:var(--accent-dark);}
.choice-row{display:flex;align-items:center;gap:8px;margin-top:8px;}
.choice-key{
  width:24px;height:24px;flex:0 0 auto;border-radius:7px;background:#f1f4f9;color:#5b6577;
  font-size:12px;font-weight:800;display:grid;place-items:center;
}
.choice-row .input{flex:1;min-width:0;}
.pick{
  min-width:56px;min-height:36px;padding:0 9px;border-radius:9px;border:1px solid var(--line);
  background:#fff;font-size:12px;font-weight:700;color:#5b6577;flex:0 0 auto;
}
.pick.is-on{background:var(--ok-soft);border-color:#bfe9d7;color:#087a51;}
.oxpick{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.oxpick-btn{
  min-height:64px;border-radius:13px;border:1.5px solid var(--line);background:#fff;
  font-size:24px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;
}
.oxpick-btn small{font-size:12px;font-weight:650;color:var(--muted);}
.oxpick-btn.is-on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-dark);}
.switch{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);font-weight:600;margin-top:9px;}
.switch input{width:18px;height:18px;accent-color:var(--accent);margin:0;}
.editor-section{border-top:1px dashed #e6ebf4;margin-top:14px;padding-top:14px;}
.editor-section:first-child{border-top:0;margin-top:0;padding-top:0;}
.editor-label{font-size:12.5px;font-weight:700;color:#5b6577;margin-bottom:6px;display:block;}
/* HOST_ONLY_END */

/* HOST_ONLY_START */
/* ── 시험 진행 ──────────────────────────────────────── */
.seg{display:flex;gap:6px;flex-wrap:wrap;}
.seg .btn{flex:1 1 0;min-width:96px;}
.status-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.invite-box{display:flex;gap:8px;align-items:center;}
.invite-box .input{flex:1;min-width:0;}
.run-note{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.6;}
.fb-status{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.fb-status .tag{font-size:11.5px;}
.sim-state{
  font-size:12.5px;font-weight:650;color:var(--accent-dark);
  background:var(--accent-soft);border:1px solid #d9e3ff;border-radius:10px;
  padding:9px 12px;margin-top:10px;
}
/* HOST_ONLY_END */

/* HOST_ONLY_START */
/* ── 대시보드 ───────────────────────────────────────── */
.dash-tools{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:space-between;
  margin-bottom:12px;
}
.dash-tools .left{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.live-dot{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#087a51;
  background:var(--ok-soft);border:1px solid #cfeee0;border-radius:999px;padding:5px 10px;
}
.live-dot i{width:6px;height:6px;border-radius:50%;background:var(--ok);animation:pulse 1.5s infinite;color:var(--ok);}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px;}
.kpi{
  background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;
  box-shadow:var(--shadow-sm);min-width:0;
}
.kpi-label{font-size:12px;color:var(--muted);font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.kpi-value{font-size:23px;font-weight:800;letter-spacing:-.025em;margin-top:3px;line-height:1.15;font-variant-numeric:tabular-nums;}
.kpi-value small{font-size:11.5px;font-weight:650;color:var(--muted);margin-left:3px;letter-spacing:0;}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.kpi.is-accent{background:linear-gradient(180deg,#f5f8ff 0%,#fff 100%);border-color:#dfe7fb;}
@media (max-width:900px){.kpis{grid-template-columns:repeat(3,1fr);}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,1fr);}.kpi-value{font-size:21px;}}

.ptable{width:100%;}
.phead,.prow{
  display:grid;grid-template-columns:1.25fr 1.25fr .85fr .7fr .75fr .8fr .5fr;
  gap:10px;align-items:center;padding:11px 18px;
}
.phead{
  font-size:11px;font-weight:750;color:var(--muted);background:#fafbfd;
  border-bottom:1px solid var(--line-soft);letter-spacing:.01em;
}
.prow{border-top:1px solid var(--line-soft);font-size:13.5px;}
.prow:first-child{border-top:0;}
.pcell{min-width:0;}
.plabel{display:none;font-size:10.5px;color:var(--muted);font-weight:700;}
.pname{display:flex;align-items:center;gap:6px;min-width:0;font-weight:750;}
.pname .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pbar-track{height:6px;border-radius:999px;background:#eef1f6;overflow:hidden;}
.pbar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#3b6ef6,#7a5cf0);transition:width .3s;}
.psub{display:block;font-size:11px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap;}
.pval{font-variant-numeric:tabular-nums;font-weight:650;}
.pval.big{font-size:14.5px;font-weight:800;}
.pval .unit{font-size:11px;color:var(--muted);font-weight:600;}
.st{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:750;border-radius:999px;padding:4px 9px;white-space:nowrap;}
.st i{width:5px;height:5px;border-radius:50%;background:currentColor;}
.st-wait{background:#f1f4f9;color:#5b6577;}
.st-live{background:var(--accent-soft);color:var(--accent-dark);}
.st-done{background:var(--ok-soft);color:#087a51;}
.pacts{justify-self:end;}
@media (max-width:820px){
  .phead{display:none;}
  .prow{display:flex;flex-wrap:wrap;gap:10px 16px;padding:14px 16px;}
  .pcell{flex:1 1 88px;}
  .pcell.pname{flex:1 1 100%;}
  .pcell.pacts{flex:0 0 auto;margin-left:auto;align-self:center;}
  .plabel{display:block;}
  .psub{white-space:normal;}
}

.qbars{display:flex;flex-direction:column;}
.qbar{padding:12px 0;border-top:1px solid var(--line-soft);}
.qbar:first-child{border-top:0;padding-top:2px;}
.qbar-top{display:flex;align-items:center;gap:9px;font-size:13.5px;}
.qbar-idx{
  width:22px;height:22px;flex:0 0 auto;border-radius:7px;background:#f1f4f9;color:#5b6577;
  font-size:11.5px;font-weight:800;display:grid;place-items:center;
}
.qbar-txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;}

function withCode(url, code) {
  var base = String(url == null ? '' : url).trim();
  if (!base) { return ''; }
  var hash = '', hi = base.indexOf('#');
  if (hi >= 0) { hash = base.slice(hi); base = base.slice(0, hi); }
  var pair = 'code=' + encodeURIComponent(code);
  var qi = base.indexOf('?');
  if (qi >= 0) {
    var kept = [], parts = base.slice(qi + 1).split('&');
    for (var i = 0; i < parts.length; i++) {
      if (parts[i] && parts[i].indexOf('code=') !== 0) { kept.push(parts[i]); }
    }
    kept.push(pair);
    return base.slice(0, qi) + '?' + kept.join('&') + hash;
  }
  return base + '?' + pair + hash;
}

var Model = {
  normShort: function (s, q) {
    var t = String(s == null ? '' : s);
    t = t.replace(/[\u200b\ufeff]/g, '').trim();
    if (q.ignoreSpace !== false) { t = t.replace(/[\s\u3000]+/g, ''); }
    if (q.ignoreCase !== false) { t = t.toLowerCase(); }
    return t;
  },
  isBlank: function (raw) {
    return raw === null || raw === undefined || String(raw).trim() === '';
  },
  judge: function (q, raw) {
    if (!q || this.isBlank(raw)) { return { answered: false, correct: false }; }
    if (q.type === 'mcq') {
      return { answered: true, correct: Number(raw) === Number(q.answer) };
    }
    if (q.type === 'ox') {
      return { answered: true, correct: String(raw).toUpperCase() === String(q.answer).toUpperCase() };
    }
    var list = q.shortAnswers || [], mine = this.normShort(raw, q);
    if (mine === '') { return { answered: false, correct: false }; }
    var contains = [];
    for (var i = 0; i < list.length; i++) {
      var normTarget = this.normShort(list[i], q);
      if (normTarget === '') { continue; }
      if (normTarget === mine) { return { answered: true, correct: true }; }
      if (q.matchContains === true) { contains.push(normTarget); }
    }
    /* 정답 단어가 포함되면 정답 처리 (예: '서울' → '서울특별시'도 정답) */
    for (var k = 0; k < contains.length; k++) {
      if (mine.indexOf(contains[k]) !== -1) { return { answered: true, correct: true }; }
    }
    return { answered: true, correct: false };
  },
  answerText: function (q, raw) {
    if (this.isBlank(raw)) { return ''; }
    if (q.type === 'mcq') {
      var i = Number(raw), c = (q.choices || [])[i];
      return c ? (CIRCLED[i] || String(i + 1)) + ' ' + c : String(raw);
    }
    if (q.type === 'ox') { return String(raw).toUpperCase(); }
    return String(raw);
  },
  correctText: function (q) {
    if (!q) { return ''; }
    if (q.type === 'mcq') {
      var i = Number(q.answer), c = (q.choices || [])[i];
      return c ? (CIRCLED[i] || String(i + 1)) + ' ' + c : '미지정';
    }
    if (q.type === 'ox') { return String(q.answer || '-').toUpperCase(); }
    var list = q.shortAnswers || [];
    return list.length ? list.join(' / ') : '미지정';
  },
  evaluate: function (exam, rec) {
    var qs = (exam && exam.questions) || [];
    var answers = (rec && rec.answers) || {};
    var items = [], answered = 0, correct = 0, earned = 0, max = 0;
    for (var i = 0; i < qs.length; i++) {
      var q = qs[i], pts = Number(q.points) || 0;
      max += pts;
      var a = answers[q.id];
      var raw = a ? a.raw : null;
      var j = this.judge(q, raw);
      if (j.answered) { answered++; }
      if (j.correct) { correct++; earned += pts; }
      items.push({
        q: q, raw: raw, answered: j.answered, correct: j.correct,
        points: pts, earned: j.correct ? pts : 0

    }
    var started = (rec && (rec.startedAt || rec.joinedAt)) || now();
    var ended = (rec && rec.submittedAt) || now();
    return {
      items: items,
      total: qs.length,
      answered: answered,
      correct: correct,
      wrong: answered - correct,
      missing: qs.length - answered,
      earned: earned,
      max: max,
      correctRate: qs.length ? Math.round(correct / qs.length * 100) : 0,
      scoreRate: max ? Math.round(earned / max * 100) : 0,

  },
  grade: function (exam, rec) {

      correctCount: ev.correct,
      durationSec: Math.round(ev.elapsed / 1000),
      answered: ev.answered

  },
  blankRecord: function (id, name, exam) {

};

var FB = {
  base: DB_BASE,
  esOpen: 0,
  subs: 0,
  failed: false,
  state: 'connecting',
  _watchers: [],

  url: function (path) { return this.base + path + '.json'; },

  watch: function (fn) {
    this._watchers.push(fn);
    try { fn(this.state); } catch (e) { /* 무시 */ }
  },
  setState: function (s) {
    if (this.state === s) { return; }
    this.state = s;
    for (var i = 0; i < this._watchers.length; i++) {
      try { this._watchers[i](s); } catch (e) { /* 무시 */ }
    }
  },
  refresh: function () {

    if (this.failed) { this.setState('offline'); return; }
    if (this.subs > 0) { this.setState('polling'); return; }
    this.setState('connecting');
  },
  note: function (ok) {

    this.refresh();

  request: function (method, path, body, cb) {

    if (body !== undefined && body !== null && method !== 'GET' && method !== 'DELETE') {
      opts.headers = { 'Content-Type': 'application/json' };
      opts.body = JSON.stringify(body);
    }
    if (typeof window.fetch !== 'function') {
      this.note(false);
      if (cb) { cb('no-fetch', null); }
      return;
    }
    var self = this;
    try {
      window.fetch(url, opts).then(function (res) {
        var status = (res && res.status) || 0;
        return res.text().then(function (txt) {
          var data = null;
          try { data = txt ? JSON.parse(txt) : null; } catch (e) { data = null; }
          if (status >= 200 && status < 300) {
            self.note(true);
            if (cb) { cb(null, data); }
          } else {
            self.note(false);
            if (cb) { cb('http-' + status, data); }
          }
        });
      })['catch'](function () {
        self.note(false);
        if (cb) { cb('network', null); }
      });
    } catch (e) {
      this.note(false);
      if (cb) { cb('throw', null); }
    }
  },

  get: function (path, cb) { this.request('GET', path, null, cb); },
  put: function (path, value, cb) { this.request('PUT', path, value, cb); },
  patch: function (path, value, cb) { this.request('PATCH', path, value, cb); },
  del: function (path, cb) { this.request('DELETE', path, null, cb); },

  subscribe: function (path, onData) { return new FBSub(path, onData); }

/* Firebase가 보내는 경로 단위 변경(/a/b)을 로컬 사본에 반영한다. */
function setPath(root, path, value) {
  var parts = String(path || '').split('/');
  var node = root, i;
  for (i = 0; i < parts.length; i++) {
    if (parts[i] === '') { continue; }
    if (i === parts.length - 1) {
      if (value === null || value === undefined) { delete node[parts[i]]; }
      else { node[parts[i]] = value; }
      return root;
    }
    if (!node[parts[i]] || typeof node[parts[i]] !== 'object') { node[parts[i]] = {}; }
    node = node[parts[i]];
  }
  return root;
}

function FBSub(path, onData) {

  this.onData = onData;
  this.data = null;
  this.es = null;
  this.open = false;
  this.closed = false;
  this.retry = null;
  this.poll = null;
  FB.subs++;

FBSub.prototype.start = function () {

  this.fetchNow();
  this.connect();
  this.poll = setInterval(function () { self.tick(); }, 2000);
};

FBSub.prototype.fetchNow = function () {
  var self = this;
  FB.get(this.path, function (err, data) {
    if (self.closed) { return; }

    self.deliver(data);

};

FBSub.prototype.deliver = function (data) {

};

FBSub.prototype.retryLater = function () {
  var self = this;

/* SSE가 살아 있으면 폴링하지 않고, 끊긴 동안에만 2초마다 전체를 다시 읽는다. */
FBSub.prototype.tick = function () {
  if (this.closed || this.open) { return; }

FBSub.prototype.stop = function () {
  this.closed = true;

/* --------------------------------------------------------------- 모달 */
var Modal = {
  back: null,
  close: function () {
    if (this.back && this.back.parentNode) { this.back.parentNode.removeChild(this.back); }
    this.back = null;
    if (document.body) { document.body.className = ''; }
  },
  open: function (opts) {
    this.close();
    var self = this;
    if (document.body) { document.body.className = 'modal-open'; }
    var head = el('div', { cls: 'modal-head' }, [
      el('h3', { text: opts.title || '' }),
      btn('✕', 'btn btn-ghost btn-sm', function () { self.close(); }, { attrs: { 'aria-label': '닫기' } })
    ]);
    var body = el('div', { cls: 'modal-body' }, opts.body || null);
    var box = el('div', { cls: 'modal' + (opts.wide ? ' is-wide' : '') }, [head, body]);
    if (opts.foot) { box.appendChild(el('div', { cls: 'modal-foot' }, opts.foot)); }
    var back = el('div', { cls: 'modal-back' }, [box]);
    if (opts.static !== true) {
      back.addEventListener('click', function (ev) {
        if (ev && ev.target === back) { self.close(); }
      });
    }
    document.body.appendChild(back);
    this.back = back;
    if (opts.focus) {
      setTimeout(function () { try { opts.focus.focus(); } catch (e) { /* 무시 */ } }, 30);
    }
    return { close: function () { self.close(); }, body: body };
  }
};

function confirmAsk(opts, onOk) {
  var okCls = opts.danger ? 'btn btn-danger' : 'btn btn-primary';
  var m = Modal.open({
    title: opts.title || '확인',
    body: el('div', null, [
      el('p', { cls: 'hintline', text: opts.body || '' }),
      opts.detail ? el('p', { cls: 'hintline', text: opts.detail }) : null
    ]),
    foot: [
      btn('취소', 'btn', function () { m.close(); }),
      btn(opts.okLabel || '확인', okCls, function () { m.close(); onOk(); })
    ]
  });
  return m;
}

/* ------------------------------------------------------------- 클립보드 */
function copyText(text, done) {
  function fallback() {
    var ok = false;
    var ta = el('textarea', { cls: 'textarea', value: text });
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    try {
      ta.focus();
      ta.select();
      if (document.execCommand) { ok = document.execCommand('copy'); }
    } catch (e) { ok = false; }
    if (ta.parentNode) { ta.parentNode.removeChild(ta); }
    done(!!ok);
  }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { fallback(); });
      return;
    }
  } catch (e) { /* fallback */ }
  fallback();
}

/* --------------------------------------------------------- 파일 내려받기 */
function downloadText(filename, text, mime) {
  try {
    var blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = el('a', { attrs: { href: url, download: filename } });
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { try { URL.revokeObjectURL(url); } catch (e) { /* 무시 */ } }, 1500);
    return true;
  } catch (e) {
    return false;
  }
}

function progressOf(exam, rec) {
  var qs = (exam && exam.questions) || [];
  if (!qs.length) { return 0; }
  var answered = 0, answers = (rec && rec.answers) || {};
  for (var i = 0; i < qs.length; i++) {
    var a = answers[qs[i].id];
    if (a && !Model.isBlank(a.raw)) { answered++; }
  }
  return Math.round(answered / qs.length * 100);
}

function csvCell(v) {
  var s = v == null ? '' : String(v);
  s = s.replace(/\r\n|\r|\n/g, ' ');
  return '"' + s.replace(/"/g, '""') + '"';
}

function csvText(exam, recs) {
  var qs = (exam && exam.questions) || [];
  var head = ['이름', '상태', '점수', '만점', '정답', '오답', '미응답', '정답률(%)', '소요시간(초)', '제출시각'];
  for (var i = 0; i < qs.length; i++) { head.push('Q' + (i + 1)); }
  var rows = [head];
  for (var r = 0; r < recs.length; r++) {
    var rec = recs[r], ev = Model.evaluate(exam, rec);
    var row = [
      rec.name || '이름 없음',
      Model.statusText(rec),
      ev.earned, ev.max, ev.correct, ev.wrong, ev.missing, ev.correctRate,
      Math.round(ev.elapsed / 1000),
      rec.submittedAt ? fmtDateTime(rec.submittedAt) : ''
    ];
    for (var j = 0; j < ev.items.length; j++) {
      var it = ev.items[j];
      row.push(it.answered ? (it.correct ? '정답 ' : '오답 ') + Model.answerText(it.q, it.raw) : '미응답');
    }
    rows.push(row);
  }
  var lines = [];
  for (var a = 0; a < rows.length; a++) {
    var cells = [];
    for (var b = 0; b < rows[a].length; b++) { cells.push(csvCell(rows[a][b])); }
    lines.push(cells.join(','));
  }
  return '\ufeff' + lines.join('\r\n') + '\r\n';
}

}

var Host = {
  tab: 'manage',
  roomCode: '',
  prevRoom: '',
  roomErr: '',
  roomInput: '',
  recs: {},
  subExam: null,
  subParts: null,
  subscribed: false,
  needLoad: false,
  lastLoadTry: 0,
  pendingSave: false,
  saveTimer: null,
  lastFlushTry: 0,
  autoEnded: false,
  subSig: '',
  dashSig: '',
  dashTimeEl: null,
  _pillStatus: null,

  /* ---------------------------------------------------------- 시작 */
  init: function () {
    var self = this;
    FB.watch(paintSync);
    this.bind();
    var saved = LS.get(KEYS.tab);
    if (saved === 'manage' || saved === 'run' || saved === 'dash') { this.tab = saved; }
    this.roomCode = this.loadRoomCode();
    var prev = RoomCode.normalize(LS.get(KEYS.prevRoom) || '');
    this.prevRoom = (RoomCode.valid(prev) && prev !== this.roomCode) ? prev : '';
    this.loadExam();
    setInterval(function () { self.tick(); }, 1000);
    document.addEventListener('keydown', function (ev) {
      if (ev && (ev.key === 'Escape' || ev.keyCode === 27)) { Modal.close(); }
    });
  },

  /* 방 코드는 이 기기의 localStorage에 남긴다. 처음이면 안전한 랜덤 코드를 만든다. */
  loadRoomCode: function () {
    var code = RoomCode.normalize(LS.get(KEYS.room) || '');
    if (!RoomCode.valid(code)) { code = RoomCode.random(); }
    LS.set(KEYS.room, code);
    return code;
  },

  bind: function () {
    var self = this;
    var tabs = [['manage', $('tabManage')], ['run', $('tabRun')], ['dash', $('tabDash')]];
    for (var i = 0; i < tabs.length; i++) {
      (function (name, node) {
        if (node) { node.addEventListener('click', function () { self.switchTab(name); }); }
      })(tabs[i][0], tabs[i][1]);
    }
  },

  loadExam: function () {
    var self = this;
    var path = DB_PATH.exam(this.roomCode);
    this.lastLoadTry = now();
    FB.get(path, function (err, data) {
      if (err) {
        self.needLoad = true;
        if (!Exam.data) { Exam.load(seedExam()); self.render(); }
        return;
      }
      self.needLoad = false;
      if (data && data.questions instanceof Array) {
        Exam.load(data);
        self.afterLoad();
        return;
      }
      /* DB가 비어 있고, 연결이 끊긴 동안 만든 사본이 있으면 그 사본을 올린다. */
      if (Exam.data) {
        FB.put(path, Exam.data, function (e3) {
          if (!e3) { self.afterLoad(); }
          else { self.pendingSave = true; self.render(); }
        });
        return;
      }
      var seed = seedExam();
      Exam.load(seed);
      FB.put(path, seed, function (e2) {
        if (!e2) { self.afterLoad(); }
        else { self.pendingSave = true; self.render(); }
      });
    });
  },

  afterLoad: function () {
    this.subscribeRoom();
    this.render();
  },

  /* 현재 방의 시험·참여자 구독을 (다시) 연결한다. */

    if (this.subExam) { this.subExam.stop(); this.subExam = null; }
    this.recs = {};
    this.subscribed = true;
