              if (ok) { toast('초대 링크를 복사했습니다.', 'ok'); }
              else { toast('자동 복사가 막혀 있습니다. 링크를 길게 눌러 직접 복사해 주세요.', 'warn'); }
            });
          }, { attrs: { 'data-role': 'room-copy-link' } })
        ])
      ])
    ]);
    if (this.prevRoom && this.prevRoom !== this.roomCode) {
      body.appendChild(el('div', { cls: 'field', style: { marginTop: '12px' } }, [
        el('span', { cls: 'label', text: '이전 코드의 방 (남아 있음)' }),
        el('div', { cls: 'invite-box' }, [
          el('input', {
            cls: 'input', type: 'text', value: this.prevRoom,
            attrs: { readonly: 'readonly', 'aria-label': '이전 초대 코드', 'data-role': 'prev-room-code', spellcheck: 'false' }
          }),
          btn('이전 방 닫기', 'btn btn-danger', function () { self.closePrevRoom(); }, { attrs: { 'data-role': 'prev-room-close' } })
        ])
      ]));
      body.appendChild(el('p', { cls: 'hintline', text: '코드를 바꾸기 전의 방은 그대로 남아 있어 이전 코드로도 들어갈 수 있습니다. 닫으면 그 방의 문항과 응시 기록이 지워지고 이전 코드는 더 이상 통하지 않습니다.' }));
    }
    if (this.roomErr) {
      body.appendChild(el('p', { cls: 'errline', style: { marginTop: '10px' }, text: this.roomErr }));
    }
    body.appendChild(el('p', { cls: 'hintline', style: { marginTop: '12px' }, text: '이 코드를 아는 사람만 입장할 수 있습니다. 코드를 바꾸면 새 코드의 방이 바로 열리고, 이전 코드의 방은 그대로 남습니다(초대는 새 코드로 보내세요).' }));
    body.appendChild(el('p', { cls: 'hintline', text: '응시자는 코드 없이는 시험 제목·문항을 볼 수 없습니다.' }));

    panel.appendChild(el('div', { cls: 'card', id: 'roomCard' }, [
      el('div', { cls: 'card-head' }, [
        el('h2', null, ['초대 코드', el('span', { cls: 'hint', text: '비공개 시험' })])
      ]),
      body
    ]));
  },

  onExam: function (data) {
    if (!data || !(data.questions instanceof Array)) { return; }
    if (this.pendingSave) { return; }
    var incoming = Exam.normalize(data);
    if (JSON.stringify(incoming) === Exam.sig()) { return; }
    Exam.data = incoming;
    this.autoEnded = false;
    this.render();
  },

  /* ------------------------------------------------------- 저장/폴링 */
  saveExam: function () {
    if (!Exam.data) { return; }
    Exam.data.updatedAt = now();
    this.pendingSave = true;
    var self = this;
    if (this.saveTimer) { clearTimeout(this.saveTimer); }
    this.saveTimer = setTimeout(function () { self.saveTimer = null; self.flush(); }, 350);
  },

  flush: function () {
    if (!Exam.data) { return; }
    var self = this;
    this.lastFlushTry = now();
    FB.put(DB_PATH.exam(this.roomCode), Exam.data, function (err) {
      if (!err) { self.pendingSave = false; }
    });
  },

  tick: function () {
    if (this.needLoad && !this.subscribed && now() - this.lastLoadTry > 4000) { this.loadExam(); }
    if (this.pendingSave && !this.saveTimer && now() - this.lastFlushTry > 2000) { this.flush(); }
    if (!Exam.data) { return; }

    var ex = Exam.data;
    if (ex.status === 'running' && ex.timeLimitMin > 0 && ex.startedAt && !this.autoEnded &&
        now() >= ex.startedAt + ex.timeLimitMin * 60000) {
      this.autoEnded = true;
      var n = this.finalize();
      Exam.applyStatus('ended');
      this.saveExam();
      this.render();
      toast('제한시간이 끝나 시험을 자동 종료했습니다.' + (n ? ' ' + n + '명을 자동 제출했습니다.' : ''), 'warn');
      return;
    }
    if (this.tab === 'run') { this.renderRunLive(); }
    else if (this.tab === 'dash') {
      if (this.dashTimeEl) { this.dashTimeEl.textContent = '마지막 갱신 ' + fmtHMS(now()); }
    }
  },

  /* --------------------------------------------------------- 공통 렌더 */
  switchTab: function (name) {
    this.tab = name;
    LS.set(KEYS.tab, name);
    this.render();
  },

  render: function () {
    if (!Exam.data) { return; }
    this.renderHeader();
    this.renderPanel();
  },

  renderHeader: function () {
    var ex = Exam.data;
    if (!ex) { return; }
    var total = Exam.totalPoints();
    var recs = this.list();
    var title = String(ex.title || '').trim() || '제목 없는 퀴즈';

    $('hostTitle').textContent = title;
    $('hostSub').textContent = ex.questions.length + '문항 · ' + total + '점 · ' +
      (ex.timeLimitMin > 0 ? '제한시간 ' + ex.timeLimitMin + '분' : '제한시간 없음');
    paintBrandTitle(title);
    $('miniJoin').textContent = String(recs.length);
    $('dashCount').textContent = String(recs.length);

    var pill = $('statusPill');
    if (pill && this._pillStatus !== ex.status) {
      clearNode(pill);
      pill.className = 'pill is-' + ex.status;
      pill.appendChild(el('span', { cls: 'dotp' }));
      pill.appendChild(document.createTextNode(STATUS_LABEL[ex.status] || ex.status));
      this._pillStatus = ex.status;
    }

    var map = { manage: $('tabManage'), run: $('tabRun'), dash: $('tabDash') };
    for (var k in map) {
      if (hasOwn(map, k) && map[k]) {
        map[k].className = 'tab' + (this.tab === k ? ' is-active' : '') +
          (k === 'dash' && ex.status === 'running' ? ' is-live' : '');
      }
    }
  },

  renderPanel: function () {
    $('panelManage').hidden = this.tab !== 'manage';
    $('panelRun').hidden = this.tab !== 'run';
    $('panelDash').hidden = this.tab !== 'dash';
    if (this.tab === 'manage') { this.renderManage(); }
    else if (this.tab === 'run') { this.renderRun(); }
    else { this.renderDash(); }
  },

  renderLive: function () {
    if (!Exam.data) { return; }
    this.renderHeader();
    if (this.tab === 'dash') {
      var recs = this.list();
      var sig = this.sigOf(recs);
      if (sig !== this.dashSig) { this.renderDash(); }
    } else if (this.tab === 'run') {
      this.renderRunLive();
    }
  },

  list: function () {
    var out = [], k;
    var src = this.recs || {};
    var round = (Exam.data && Exam.data.round) || 1;
    for (k in src) {
      if (hasOwn(src, k) && src[k] && typeof src[k] === 'object' && src[k].id) {
        /* 지난 라운드의 기록은 집계에서 제외한다 (초기화 직후의 늦은 쓰기 대비) */
        if ((Number(src[k].round) || 1) !== round) { continue; }
        out.push(src[k]);
      }
    }
    out.sort(function (a, b) { return (a.joinedAt || 0) - (b.joinedAt || 0); });
    return out;
  },

  /* ======================================================= 문제 관리 */
  renderManage: function () {
    var panel = $('panelManage');
    clearNode(panel);
    this.renderRoomCard(panel);
    this.renderGuide(panel);
    this.renderSettings(panel);
    this.renderQuestions(panel);
  },

  renderGuide: function (panel) {
    var self = this;
    if (LS.get(KEYS.guide) === '1') { return; }
    var steps = [
      '문항·배점·제한시간을 확인하세요. 처음 열면 샘플 5문항이 DB에 저장되어 바로 시작할 수 있습니다.',
      '"시험 진행"에서 [진행 중]을 누르면 팀원 화면에 문제가 실시간으로 열립니다.',
      '[초대 코드]를 복사해 보내거나 [초대 링크]를 그대로 보내세요. 팀원은 코드를 넣어야 입장하며 각자 자기 기기에서 응시합니다.',
      '"실시간 결과"에서 참여 현황·점수·문항별 정답률이 자동으로 모입니다.'
    ];
    var body = el('div', { cls: 'card-body' });
    for (var i = 0; i < steps.length; i++) {
      body.appendChild(el('div', { cls: 'guide-step' }, [
        el('b', { text: String(i + 1) }),
        el('span', { text: steps[i] })
      ]));
    }
    panel.appendChild(el('div', { cls: 'card' }, [
      el('div', { cls: 'card-head' }, [
        el('h2', { text: '처음이라면 이 순서로' }),
        btn('×', 'btn btn-ghost btn-sm', function () {
          LS.set(KEYS.guide, '1');
          self.renderManage();
        }, { attrs: { 'aria-label': '안내 닫기' }, title: '다시 보지 않기' })
      ]),
      body
    ]));
  },

  renderSettings: function (panel) {
    var ex = Exam.data;
    var self = this;
    var saved = el('span', { cls: 'saveline', text: '저장됨' });
    function flash() {
      saved.className = 'saveline on';
      setTimeout(function () { saved.className = 'saveline'; }, 1400);
    }

    var titleIn = el('input', {
      cls: 'input', type: 'text', value: ex.title,
      attrs: { maxlength: '60', 'aria-label': '시험 제목', placeholder: '예) 2026 익스퀴즈', 'data-role': 'exam-title' }
    });
    titleIn.addEventListener('input', debounce(function () {
      var v = String(titleIn.value || '');
      if (!v.trim()) { return; }
      ex.title = v;
      self.saveExam();
      self.renderHeader();
      flash();
    }, 400));
    titleIn.addEventListener('blur', function () {
      if (!String(titleIn.value || '').trim()) {
        ex.title = '제목 없는 퀴즈';
        titleIn.value = ex.title;
        self.saveExam();
        self.renderHeader();
        flash();
      }
    });

    var timeIn = el('input', {
      cls: 'input', type: 'number', value: String(ex.timeLimitMin || 0),
      attrs: { min: '0', max: '300', inputmode: 'numeric', 'aria-label': '제한시간(분)', 'data-role': 'exam-time' }
    });
    timeIn.addEventListener('input', debounce(function () {
      var v = parseInt(timeIn.value, 10);
      if (isNaN(v) || v < 0) { v = 0; }
      if (v > 300) { v = 300; }
      ex.timeLimitMin = v;
      self.saveExam();
      self.renderHeader();
      flash();
    }, 350));

    panel.appendChild(el('div', { cls: 'card' }, [
      el('div', { cls: 'card-head' }, [el('h2', null, ['시험 설정', saved])]),
      el('div', { cls: 'card-body' }, [
        el('div', { cls: 'field' }, [el('span', { cls: 'label', text: '시험 제목' }), titleIn]),
        el('div', { cls: 'grid-2', style: { marginTop: '12px' } }, [
          el('div', { cls: 'field' }, [el('span', { cls: 'label', text: '제한시간 (분)' }), timeIn]),
          el('div', { cls: 'field' }, [
            el('span', { cls: 'label', text: '실시간 저장' }),
            el('p', { cls: 'hintline', text: '변경 내용은 Firebase DB에 자동 저장되어 팀원 화면에 바로 반영됩니다.' })
          ])
        ]),
        el('p', { cls: 'hintline', style: { marginTop: '10px' }, text: '제한시간 0분 = 무제한 · 제한시간이 끝나면 자동으로 종료되고 미제출자는 자동 제출됩니다.' })
      ])
    ]));
  },

  renderQuestions: function (panel) {
    var self = this;
    var qs = Exam.data.questions;
    var total = Exam.totalPoints();

    var head = el('div', { cls: 'card-head' }, [
      el('h2', null, ['문항', el('span', { cls: 'hint', text: qs.length + '개 · 총 ' + total + '점' })]),
      btn('+ 문항 추가', 'btn btn-soft btn-sm', function () { self.openEditor(null); })
    ]);

    var body;
    if (!qs.length) {
      body = el('div', { cls: 'empty' }, [
        el('b', { text: '아직 문항이 없습니다.' }),
        el('p', { text: '문항 추가를 눌러 5지선다·OX·단답형 문제를 만들어 주세요.' }),
        el('div', { cls: 'empty-acts' }, [
          btn('첫 문항 추가', 'btn btn-primary', function () { self.openEditor(null); })
        ])
      ]);
    } else {
      body = el('div', { cls: 'qlist' });
      for (var i = 0; i < qs.length; i++) { body.appendChild(this.questionRow(qs[i], i)); }
    }
    panel.appendChild(el('div', { cls: 'card' }, [head, body]));
  },

  questionRow: function (q, i) {
    var self = this;
    var qs = Exam.data.questions;
    var pts = Number(q.points) || 0;
    return el('div', { cls: 'qitem' }, [
      el('div', { cls: 'qnum', text: String(i + 1) }),
      el('div', { cls: 'qmain' }, [
        el('div', { cls: 'qtext', text: q.text }),
        el('div', { cls: 'qmeta' }, [
          el('span', { cls: 'tag ' + (TYPE_TAG[q.type] || ''), text: TYPE_LABEL[q.type] || q.type }),
          el('span', { cls: 'tag tag-pts', text: pts + '점' }),
          el('span', { cls: 'qans', text: '정답 ' + Model.correctText(q) })
        ])
      ]),
      el('div', { cls: 'qacts' }, [
        btn('↑', 'btn btn-sm btn-icon', function () { self.moveQuestion(i, -1); }, { title: '위로', attrs: { 'aria-label': (i + 1) + '번 문항 위로' }, disabled: i === 0 }),
        btn('↓', 'btn btn-sm btn-icon', function () { self.moveQuestion(i, 1); }, { title: '아래로', attrs: { 'aria-label': (i + 1) + '번 문항 아래로' }, disabled: i === qs.length - 1 }),
        btn('수정', 'btn btn-sm', function () { self.openEditor(q.id); }),
        btn('삭제', 'btn btn-sm btn-danger', function () {
          confirmAsk({
            title: '문항을 삭제할까요?',
            body: '삭제한 문항과 그 문항의 응답은 되돌릴 수 없습니다.',
            danger: true,
            okLabel: '삭제'
          }, function () {
            var idx = Exam.find(q.id);
            if (idx >= 0) { Exam.data.questions.splice(idx, 1); self.saveExam(); }
            self.render();
            toast('문항을 삭제했습니다.', 'ok');
          });
        })
      ])
    ]);
  },

  moveQuestion: function (i, dir) {
    var qs = Exam.data.questions;
    var j = i + dir;
    if (j < 0 || j >= qs.length) { return; }
    var tmp = qs[i];
    qs[i] = qs[j];
    qs[j] = tmp;
    this.saveExam();
    this.renderManage();
  },

  openEditor: function (qid) {
    var self = this;
    var isNew = !qid;
    var idx = isNew ? -1 : Exam.find(qid);
    if (!isNew && idx < 0) { toast('문항을 찾을 수 없습니다.', 'err'); return; }

    var draft;
    if (isNew) {
      draft = {
        id: uid('q'), type: 'mcq', text: '', choices: ['', '', '', '', ''],
        answer: 0, shortAnswers: [''], ignoreCase: true, ignoreSpace: true,
        matchContains: false, points: 20, explain: ''
      };
    } else {
      draft = clone(Exam.data.questions[idx]);
      if (!draft.choices) { draft.choices = ['', '', '', '', '']; }
      while (draft.choices.length < 5) { draft.choices.push(''); }
      if (!draft.shortAnswers) { draft.shortAnswers = ['']; }
      if (draft.type === 'mcq') { draft.answer = Number(draft.answer) || 0; }
      if (draft.type === 'ox') { draft.answer = String(draft.answer || 'O').toUpperCase(); }
    }

    var body = el('div');
    var err = el('span', { cls: 'errline' });
    var pickRefs = [];
    var oxRefs = [];

    function paintPicks() {
      for (var k = 0; k < pickRefs.length; k++) {
        var on = Number(draft.answer) === pickRefs[k].i;
        pickRefs[k].node.className = 'pick' + (on ? ' is-on' : '');
        pickRefs[k].node.textContent = on ? '정답' : '선택';
      }
    }

    function paintOx() {
      for (var k = 0; k < oxRefs.length; k++) {
        var on = String(draft.answer) === oxRefs[k].v;
        oxRefs[k].node.className = 'oxpick-btn' + (on ? ' is-on' : '');
      }
    }

    function section(label, kids) {
      return el('div', { cls: 'editor-section' }, [el('span', { cls: 'editor-label', text: label })].concat(kids));
    }

    function switchRow(label, checked, onChange, role) {
      var cb = el('input', { type: 'checkbox', attrs: { 'aria-label': label } });
      cb.checked = !!checked;
      if (role) { cb.setAttribute('data-role', role); }
      cb.addEventListener('change', function () { onChange(cb.checked); });
      return el('label', { cls: 'switch' }, [cb, label]);
    }

    function paint() {
      clearNode(body);
      pickRefs = [];
      oxRefs = [];

      var chips = el('div', { cls: 'typechips' });
      var types = [['mcq', '5지선다'], ['ox', 'OX'], ['short', '단답형']];
      for (var t = 0; t < types.length; t++) {
        (function (key, label) {
          chips.appendChild(btn(label, 'tchip' + (draft.type === key ? ' is-on' : ''), function () {
            draft.type = key;
            if (key === 'ox') { draft.answer = String(draft.answer || 'O').toUpperCase() === 'X' ? 'X' : 'O'; }
            if (key === 'mcq') { draft.answer = Number(draft.answer) || 0; }
            paint();
          }, { attrs: { 'data-role': 'type-' + key } }));
        })(types[t][0], types[t][1]);
      }
      body.appendChild(section('문항 유형', [chips]));

      var ta = el('textarea', {
        cls: 'textarea', value: draft.text,
        attrs: { rows: '3', maxlength: '400', 'aria-label': '문제 내용', placeholder: '문제를 입력하세요', 'data-role': 'q-text' }
      });
      ta.addEventListener('input', function () { draft.text = ta.value; });
      body.appendChild(section('문제', [ta]));

      if (draft.type === 'mcq') {
        var wrap = el('div');
        for (var i = 0; i < 5; i++) {
          (function (i) {
            var input = el('input', {
              cls: 'input', type: 'text', value: draft.choices[i] || '',
              attrs: { maxlength: '120', placeholder: (i + 1) + '번 보기', 'aria-label': (i + 1) + '번 보기', 'data-role': 'choice-' + i }
            });
            input.addEventListener('input', function () { draft.choices[i] = input.value; });
            var isOn = Number(draft.answer) === i;
            var pick = btn(isOn ? '정답' : '선택', 'pick' + (isOn ? ' is-on' : ''), function () {
              draft.answer = i;
              paintPicks();
            }, { attrs: { 'aria-label': (i + 1) + '번 보기를 정답으로', 'data-role': 'pick-' + i } });
            pickRefs.push({ i: i, node: pick });
            wrap.appendChild(el('div', { cls: 'choice-row' }, [
              el('span', { cls: 'choice-key', text: CIRCLED[i] }), input, pick
            ]));
          })(i);
        }
        wrap.appendChild(el('p', { cls: 'hintline', text: '보기를 2개 이상 채워 주세요. 비어 있는 보기는 저장할 때 빠집니다.' }));
        body.appendChild(section('보기와 정답', [wrap]));
      } else if (draft.type === 'ox') {
        var ox = el('div', { cls: 'oxpick' });
        var opts = [['O', '맞다'], ['X', '아니다']];
        for (var o = 0; o < opts.length; o++) {
          (function (v, sub) {
            var node = btn(v + '  ' + sub, 'oxpick-btn' + (String(draft.answer) === v ? ' is-on' : ''), function () {
              draft.answer = v;
              paintOx();
            }, { attrs: { 'data-role': 'ox-' + v } });
            ox.appendChild(node);
            oxRefs.push({ v: v, node: node });
          })(opts[o][0], opts[o][1]);
        }
        body.appendChild(section('정답', [ox]));
      } else {
        var shortIn = el('input', {
          cls: 'input', type: 'text', value: (draft.shortAnswers || []).join(', '),
          attrs: { maxlength: '200', placeholder: '예) 세종, 세종대왕', 'aria-label': '정답 (쉼표로 복수 정답)', 'data-role': 'short-answer' }
        });
        shortIn.addEventListener('input', function () {
          draft.shortAnswers = String(shortIn.value || '').split(/[,，]/);
        });
        body.appendChild(section('정답 (쉼표로 복수 정답)', [
          shortIn,
          switchRow('대소문자 무시', draft.ignoreCase !== false, function (v) { draft.ignoreCase = v; }),
          switchRow('띄어쓰기 무시', draft.ignoreSpace !== false, function (v) { draft.ignoreSpace = v; }),
          switchRow("정답 단어가 포함되면 정답 처리 (예: '서울' → '서울시'도 정답)",
            draft.matchContains === true, function (v) { draft.matchContains = v; }, 'match-contains'),
          el('p', { cls: 'hintline', text: '예: "세종, 세종대왕"처럼 여러 정답을 허용합니다.' })
        ]));
      }

      var ptsIn = el('input', {
        cls: 'input', type: 'number', value: String(draft.points || 1),
        attrs: { min: '1', max: '1000', inputmode: 'numeric', 'aria-label': '배점', 'data-role': 'q-points' }
      });
      ptsIn.addEventListener('input', function () { draft.points = ptsIn.value; });
      var exIn = el('textarea', {
        cls: 'textarea', value: draft.explain || '',
        attrs: { rows: '2', maxlength: '400', 'aria-label': '해설', placeholder: '해설 (시험이 끝난 뒤 팀원에게 보입니다)', 'data-role': 'q-explain' }
      });
      exIn.addEventListener('input', function () { draft.explain = exIn.value; });
      body.appendChild(section('배점과 해설', [
        el('div', { cls: 'grid-2' }, [
          el('div', { cls: 'field' }, [el('span', { cls: 'label', text: '배점' }), ptsIn]),
          el('div', { cls: 'field' }, [el('span', { cls: 'label', text: '현재 합계' }), el('p', { cls: 'hintline', text: '저장 후 상단에 총점이 표시됩니다.' })])
        ]),
        el('div', { cls: 'field', style: { marginTop: '10px' } }, [el('span', { cls: 'label', text: '해설' }), exIn])
      ]));
    }

    function saveDraft() {
      var t = String(draft.text || '').trim();
      if (!t) { err.textContent = '문제 내용을 입력해 주세요.'; return; }
      if (draft.type === 'mcq') {
        var kept = [], ansIdx = -1;
        for (var i = 0; i < 5; i++) {
          var c = String(draft.choices[i] || '').trim();
          if (c) {
            if (i === Number(draft.answer)) { ansIdx = kept.length; }
            kept.push(c);
          }
        }
        if (kept.length < 2) { err.textContent = '보기를 2개 이상 입력해 주세요.'; return; }
        if (ansIdx < 0) { ansIdx = 0; }
        draft.choices = kept;
        draft.answer = ansIdx;
        draft.shortAnswers = [];
        draft.matchContains = false;
      } else if (draft.type === 'ox') {
        draft.answer = String(draft.answer || 'O').toUpperCase() === 'X' ? 'X' : 'O';
        draft.choices = [];
        draft.shortAnswers = [];
        draft.matchContains = false;
      } else {
        var list = [];
        for (var j = 0; j < (draft.shortAnswers || []).length; j++) {
          var s = String(draft.shortAnswers[j] || '').trim();
          if (s) { list.push(s); }
        }
        if (!list.length) { err.textContent = '정답을 1개 이상 입력해 주세요. (복수 정답은 쉼표로 구분)'; return; }
        draft.shortAnswers = list;
        draft.choices = [];
        draft.ignoreCase = draft.ignoreCase !== false;
        draft.ignoreSpace = draft.ignoreSpace !== false;
        draft.matchContains = draft.matchContains === true;
      }
      var pts = parseInt(draft.points, 10);
      if (isNaN(pts) || pts < 1) { pts = 1; }
      if (pts > 1000) { pts = 1000; }
      draft.points = pts;
      draft.text = t;
      draft.explain = String(draft.explain || '').trim();

      if (isNew) { Exam.data.questions.push(draft); }
      else { Exam.data.questions[idx] = draft; }
      self.saveExam();
      m.close();
      self.render();
      toast(isNew ? '문항을 추가했습니다.' : '문항을 수정했습니다.', 'ok');
    }

    paint();

    var m = Modal.open({
      title: isNew ? '문항 추가' : '문항 수정',
      body: body,
      wide: true,
      foot: [
        err,
        btn('취소', 'btn', function () { m.close(); }),
        btn(isNew ? '추가' : '저장', 'btn btn-primary', saveDraft)
      ]
    });
    return m;
  },

  /* ======================================================= 시험 진행 */
  renderRun: function () {
    var self = this;
    var panel = $('panelRun');
    clearNode(panel);
    var ex = Exam.data;
    var recs = this.list();

    var seg = el('div', { cls: 'seg' });
    var states = [['waiting', '대기 중'], ['running', '진행 중'], ['ended', '종료']];
    for (var i = 0; i < states.length; i++) {
      (function (key, label) {
        seg.appendChild(btn(label, 'btn' + (ex.status === key ? ' btn-primary' : ''), function () {
          self.changeStatus(key);
        }, { attrs: { 'data-role': 'status-' + key } }));
      })(states[i][0], states[i][1]);
    }
    var desc;
    if (ex.status === 'waiting') {
      desc = '아직 시작하지 않았습니다. "진행 중"으로 바꾸면 팀원 화면에 문제가 열립니다.';
    } else if (ex.status === 'running') {
      desc = this.runDesc();
    } else {
      desc = '종료 ' + fmtHM(ex.endedAt) + ' · 팀원은 결과만 볼 수 있습니다.';
    }
    panel.appendChild(el('div', { cls: 'card' }, [
      el('div', { cls: 'card-head' }, [
        el('h2', { text: '시험 상태' }),
        el('span', { cls: 'hint', text: '바꾸면 팀원 화면에 실시간으로 반영됩니다' })
      ]),
      el('div', { cls: 'card-body' }, [
        el('div', { cls: 'status-line' }, [statusPill(ex.status), el('span', { cls: 'hint', id: 'runDesc', text: desc })]),
        seg,
        el('p', { cls: 'run-note', text: '종료하면 아직 제출하지 않은 팀원은 지금까지의 답안으로 자동 제출됩니다. 대기 중으로 되돌리면 참여자 응답이 함께 초기화됩니다.' })
      ])
    ]));

    /* 실시간 제출 현황 */
    panel.appendChild(this.submitCard());

    /* 초대 코드 · 초대 링크 */
    var codeVal = el('input', {
      cls: 'input', type: 'text', value: this.roomCode,
      attrs: { readonly: 'readonly', 'aria-label': '현재 초대 코드', 'data-role': 'room-code', spellcheck: 'false' }
    });
    var linkIn = el('input', {
      cls: 'input', type: 'text', value: this.inviteLink(),
      placeholder: '팀원 응시 주소를 붙여 넣으세요',
      attrs: { 'aria-label': '팀원 초대 링크', 'data-role': 'invite-url', spellcheck: 'false' }
    });
    linkIn.addEventListener('input', function () { LS.set(KEYS.invite, String(linkIn.value || '').trim()); });
    function copyLink() {
      var base = String(linkIn.value || '').trim() || self.memberUrl();
      LS.set(KEYS.invite, base);
      var full = withCode(base, self.roomCode);
      copyText(full, function (ok) {
        if (ok) { toast('초대 링크를 복사했습니다.', 'ok'); }
        else { toast('자동 복사가 막혀 있습니다. 링크를 길게 눌러 직접 복사해 주세요.', 'warn'); }
      });
    }
    panel.appendChild(el('div', { cls: 'card' }, [
      el('div', { cls: 'card-head' }, [el('h2', { text: '초대 코드 · 초대 링크' })]),
      el('div', { cls: 'card-body' }, [
        el('div', { cls: 'field' }, [
          el('span', { cls: 'label', text: '초대 코드 (이 코드를 아는 사람만 입장)' }),
          el('div', { cls: 'invite-box' }, [
            codeVal,
            btn('코드만 복사', 'btn btn-soft', function () {
              copyText(self.roomCode, function (ok) {
                if (ok) { toast('초대 코드를 복사했습니다.', 'ok'); }
                else { toast('자동 복사가 막혀 있습니다. 코드를 길게 눌러 복사해 주세요.', 'warn'); }
              });
            }, { attrs: { 'data-role': 'copy-code' } })
          ])
        ]),
        el('div', { cls: 'field', style: { marginTop: '12px' } }, [
          el('span', { cls: 'label', text: '초대 링크 (응시용 주소 + 코드)' }),
          el('div', { cls: 'invite-box' }, [
            linkIn,
            btn('링크 복사', 'btn btn-soft', copyLink, { attrs: { 'data-role': 'copy-invite' } })
          ])
        ]),
        el('div', { cls: 'row tight', style: { marginTop: '8px' } }, [
          btn('현재 주소 기준으로 채우기', 'btn btn-sm', function () {
            var v = self.autoMemberUrl();
            linkIn.value = withCode(v, self.roomCode);
            LS.set(KEYS.invite, linkIn.value);
            toast('팀원 주소를 채웠습니다. 실제 배포 주소인지 확인해 주세요.', 'ok');
          }, { attrs: { 'data-role': 'fill-invite' } }),
          btn('코드 새로 만들기', 'btn btn-sm', function () { self.randomRoomCode(); }, { attrs: { 'data-role': 'run-room-new' } })
        ]),
        el('p', { cls: 'run-note', text: '팀원에게는 이 링크 하나만 보내면 됩니다. 링크에 현재 코드가 들어 있어 코드를 따로 입력하지 않아도 됩니다.' }),
        el('p', { cls: 'run-note', text: '팀원 화면에는 출제 기능이 전혀 없고 자기 결과만 보입니다. (파일에 window.__MEMBER_URL__ 값을 넣어 두면 그 주소와 코드로 링크가 만들어집니다.)' })
      ])
    ]));

    /* 응답 초기화 */
    panel.appendChild(el('div', { cls: 'card' }, [
      el('div', { cls: 'card-head' }, [el('h2', { text: '응답 초기화' })]),
      el('div', { cls: 'card-body' }, [
        el('p', { cls: 'hintline', text: '참여자 기록과 응답을 DB에서 모두 지웁니다. 문항과 시험 설정은 그대로 남습니다.' }),
        el('p', { cls: 'hintline', text: '현재 참여자 ' + recs.length + '명 · 제출 ' + this.countBy('submitted') + '명' }),
        el('div', { cls: 'row', style: { marginTop: '12px' } }, [
          btn('응답 초기화', 'btn btn-danger', function () {
            confirmAsk({
              title: '응답을 초기화할까요?',
              body: '참여자 ' + recs.length + '명의 응답이 모두 지워집니다. 문항과 설정은 남습니다.',
              danger: true,
              okLabel: '초기화'
            }, function () { self.resetResponses(); });
          }, { attrs: { 'data-role': 'reset-responses' } })
        ])
      ])
    ]));

    /* 연동 정보 */
    panel.appendChild(el('div', { cls: 'card' }, [
      el('div', { cls: 'card-head' }, [el('h2', { text: '실시간 연동 상태' })]),
      el('div', { cls: 'card-body' }, [
        el('p', { cls: 'hintline', text: 'DB: ' + DB_BASE + '/rooms/' + this.roomCode }),
        el('p', { cls: 'hintline', text: '출제자 화면은 참여자 목록을 실시간(SSE)으로 받고, 연결이 끊기면 2초마다 다시 확인합니다. 상단 배지에서 연결 상태를 볼 수 있습니다.' })
      ])
    ]));

    this.subSig = '';
    this.paintSubmit();
  },

  /* --------------------------------------------------- 실시간 제출 현황 */
  goal: function () {
    var v = parseInt(LS.get(KEYS.goal), 10);
    if (isNaN(v) || v < 1) { return 0; }
    return Math.min(999, v);
  },

  setGoal: function (raw) {
    var v = parseInt(String(raw == null ? '' : raw).replace(/[^0-9]/g, ''), 10);
    if (isNaN(v) || v < 1) { LS.del(KEYS.goal); }
    else { LS.set(KEYS.goal, String(Math.min(999, v))); }
    this.subSig = '';
    this.paintSubmit();
  },

  submitStats: function () {
    var recs = this.list();
    var done = 0, live = 0, wait = 0, names = [];
    for (var i = 0; i < recs.length; i++) {
      var r = recs[i];
      if (r.status === 'submitted') { done++; }
      else if (r.status === 'answering') { live++; }
      else { wait++; }
      names.push((r.name || '이름 없음') + ':' + String(r.status));
    }
    var total = recs.length;
    var goal = this.goal();
    var running = Exam.status() === 'running';
    /* 목표 인원을 정했으면 그만큼 모인 뒤 전원 제출, 아니면 지금 참여자 전원 제출이면 완료 */
    var allDone = running && total >= 1 && done === total && (goal > 0 ? total >= goal : true);
    var denom = goal > total ? goal : total;
    return {
      done: done, live: live, wait: wait, total: total, goal: goal, denom: denom,
      pct: denom ? Math.round(done / denom * 100) : 0,
      running: running, allDone: allDone, names: names.join(',')
    };
  },

  submitCard: function () {
    var self = this;
    var goal = this.goal();
    var goalIn = el('input', {
      cls: 'input', type: 'number', value: goal ? String(goal) : '',
      attrs: {
        min: '1', max: '999', inputmode: 'numeric', placeholder: '예) 10',
        'aria-label': '목표 응시 인원', 'data-role': 'goal-count'
      }
    });
    goalIn.addEventListener('input', debounce(function () { self.setGoal(goalIn.value); }, 300));
    goalIn.addEventListener('blur', function () { self.setGoal(goalIn.value); });

    return el('div', { cls: 'card', id: 'submitCard' }, [
      el('div', { cls: 'card-head' }, [
        el('h2', null, ['제출 현황', el('span', { cls: 'hint', id: 'submitPct', text: '0%' })]),
        el('span', { cls: 'hint', text: '실시간 자동 갱신' })
      ]),
      el('div', { cls: 'card-body' }, [
        el('div', { cls: 'sub-status' }, [
          el('span', { cls: 'sub-count', id: 'submitCount', text: '제출 완료 0 / 0명' }),
          el('span', { cls: 'sub-goal', id: 'submitGoalText', text: '' })
        ]),
        el('div', { cls: 'sub-track' }, [
          el('div', { cls: 'sub-fill', id: 'submitFill', style: { width: '0%' } })
        ]),
        el('div', { cls: 'sub-meta', id: 'submitMeta' }),
        el('div', { cls: 'schips', id: 'submitChips' }),
        el('div', { cls: 'goal-row' }, [
          el('span', { text: '목표 응시 인원' }),
          goalIn,
          el('span', { text: '명' }),
          el('span', { cls: 'hint', text: '비워 두면 현재 참여자 전원이 제출했을 때 완료로 봅니다.' })
        ]),
        el('div', { id: 'submitDone' })
      ])
    ]);
  },

  paintSubmit: function () {
    if (!Exam.data) { return; }
    if (!$('submitCard')) { return; }
    var st = this.submitStats();
    var sig = [Exam.status(), st.done, st.total, st.live, st.wait, st.goal, st.allDone, st.names].join('|');
    if (sig === this.subSig) { return; }
    this.subSig = sig;

    var count = $('submitCount');
    if (count) {
      clearNode(count);
      count.appendChild(document.createTextNode('제출 완료 '));
      count.appendChild(el('b', { text: String(st.done) }));
      count.appendChild(document.createTextNode(' / ' + st.total + '명'));
    }

    var goalText = $('submitGoalText');
    if (goalText) {
      if (st.goal > 0) {
        goalText.textContent = '목표 ' + st.goal + '명 중 ' + st.done + '명 완료' +
          (st.total < st.goal ? ' · 아직 ' + (st.goal - st.total) + '명 참여 전' : '');
      } else {
        goalText.textContent = '현재 참여자 ' + st.total + '명 기준';
      }
    }

    var pct = $('submitPct');
    if (pct) { pct.textContent = st.pct + '%'; }

    var fill = $('submitFill');
    if (fill) {
      fill.style.width = st.pct + '%';
      fill.className = 'sub-fill' + (st.total > 0 && st.done === st.total ? ' is-done' : '');
    }

    var meta = $('submitMeta');
    if (meta) {
      clearNode(meta);
      meta.appendChild(el('span', { text: '응시 중 ' + st.live + '명' }));
      meta.appendChild(el('span', { text: '대기 중 ' + st.wait + '명' }));
      meta.appendChild(el('span', {
        text: st.running ? '시험 진행 중' : '시험 ' + (STATUS_LABEL[Exam.status()] || Exam.status())
      }));
    }

    var chips = $('submitChips');
    if (chips) {
      clearNode(chips);
      var recs = this.list();
      if (!recs.length) {
        chips.appendChild(el('span', {
          cls: 'schip-empty',
          text: '아직 참여한 팀원이 없습니다. 초대 링크를 보내면 입장과 동시에 이 목록에 나타납니다.'
        }));
      }
      for (var i = 0; i < recs.length; i++) {
        var r = recs[i];
        var cls = 'schip' + (r.status === 'submitted' ? ' is-done' : (r.status === 'answering' ? ' is-live' : ' is-wait'));
        chips.appendChild(el('span', { cls: cls }, [
          el('span', { cls: 'nm', text: r.name || '이름 없음' }),
          statusChip(r)
        ]));
      }
    }

    var doneBox = $('submitDone');
    if (doneBox) {
      clearNode(doneBox);
      if (st.allDone) {
        var self = this;
        doneBox.appendChild(el('div', { cls: 'all-done' }, [
          el('div', null, [
            el('b', { text: '참여자 전원 제출 완료!' }),
            el('p', { cls: 'hintline', style: { marginTop: '3px' }, text: '이제 종료하면 팀원 화면에 정답과 해설이 바로 공개됩니다.' })
          ]),
          btn('시험 종료 및 정답 공개', 'btn btn-ok', function () { self.changeStatus('ended'); }, { attrs: { 'data-role': 'end-all' } })
        ]));
      }
    }
  },

  countBy: function (status) {
    var list = this.list(), n = 0;
    for (var i = 0; i < list.length; i++) { if (list[i].status === status) { n++; } }
    return n;
  },

  runDesc: function () {
    var ex = Exam.data;
    if (!ex || ex.status !== 'running') { return ''; }
    var rem = Exam.remaining();
    return '시작 ' + fmtHM(ex.startedAt) + ' · ' +
      (rem === null || rem < 0 ? '제한시간 없음' : '남은 시간 ' + fmtClock(rem)) +
      ' · 참여 ' + this.list().length + '명';
  },

  renderRunLive: function () {
    var desc = $('runDesc');
    if (desc) { desc.textContent = this.runDesc(); }
    this.paintSubmit();
  },

  changeStatus: function (status) {
    var self = this;
    var ex = Exam.data;
    if (!ex || ex.status === status) { return; }

    if (status === 'waiting') {
      confirmAsk({
        title: '대기 중으로 되돌릴까요?',
        body: '진행 중이던 응시가 중단되고 참여자 응답이 모두 지워집니다.',
        danger: true,
        okLabel: '되돌리기'
      }, function () {
        Exam.applyStatus('waiting');
        self.saveExam();
        self.resetResponses(true);
        self.render();
        toast('대기 중으로 되돌렸습니다. 참여자 기록을 초기화했습니다.', 'warn');
      });
      return;
    }

    if (status === 'running') {
      var had = this.list().length;
      var go = function () {
        Exam.applyStatus('running');
        self.autoEnded = false;
        self.saveExam();
        self.render();
        toast('시험을 시작했습니다. 팀원 화면에 문제가 열립니다.', 'ok');
      };
      if (ex.status === 'ended' && had) {
        confirmAsk({
          title: '새 라운드를 시작할까요?',
          body: '이전 응시 기록 ' + had + '건은 지워지고 처음부터 다시 시작합니다.',
          okLabel: '새로 시작'
        }, function () { self.resetResponses(true); go(); });
        return;
      }
      go();
      return;
    }

    confirmAsk({
      title: '시험을 종료할까요?',
      body: '아직 제출하지 않은 팀원은 지금까지의 답안으로 자동 제출됩니다.',
      okLabel: '종료'
    }, function () {
      var n = self.finalize();
      Exam.applyStatus('ended');
      self.saveExam();
      self.render();
      toast(n ? n + '명을 자동 제출하고 시험을 종료했습니다.' : '시험을 종료했습니다.', 'ok');
    });
  },

  finalize: function () {
    var list = this.list(), n = 0;
    for (var i = 0; i < list.length; i++) {
      var r = list[i];
      if (r.status === 'submitted') { continue; }
      var g = Model.grade(Exam.data, r);
      var patch = {
        status: 'submitted', submittedAt: now(), auto: true,
        score: g.score, maxScore: g.maxScore, correctCount: g.correctCount, durationSec: g.durationSec
      };
      FB.patch(DB_PATH.participant(this.roomCode, r.id), patch);
      r.status = 'submitted';
      r.submittedAt = patch.submittedAt;
      r.auto = true;
      r.score = g.score;
      r.maxScore = g.maxScore;
      r.correctCount = g.correctCount;
      r.durationSec = g.durationSec;
      n++;
    }
    return n;
  },

  resetResponses: function (silent) {
    var self = this;
    if (Exam.data) {
      Exam.data.round = (Number(Exam.data.round) || 1) + 1;
      Exam.data.updatedAt = now();
    }
    /* 라운드를 먼저 알려야 응시 중인 팀원이 옛 기록을 다시 쓰지 않는다. */
    if (this.saveTimer) { clearTimeout(this.saveTimer); this.saveTimer = null; }
    if (Exam.data) {
      FB.put(DB_PATH.exam(this.roomCode), Exam.data, function () { /* 결과는 아래 DELETE가 정리한다 */ });
      this.pendingSave = false;
    }
    FB.del(DB_PATH.participants(this.roomCode), function (err) {
      if (err) { toast('초기화하지 못했습니다. 연결 상태를 확인해 주세요.', 'err'); return; }
      self.recs = {};
      self.dashSig = '';
      if (!silent) {
        self.render();
        toast('참여자 기록을 초기화했습니다.', 'ok');
      }
    });
  },

  /* =================================================== 실시간 결과 */
  sigOf: function (recs) {
    var ex = Exam.data || {};
    var parts = [ex.status, (ex.questions || []).length, String(ex.title), String(ex.updatedAt)];
    var answering = false;
    for (var i = 0; i < recs.length; i++) {
      var r = recs[i], n = 0;
      var ans = r.answers || {};
      for (var k in ans) { if (hasOwn(ans, k)) { n++; } }
      if (r.status === 'answering') { answering = true; }
      parts.push(r.id + ':' + r.status + ':' + n + ':' + (r.submittedAt || 0) + ':' + (r.name || ''));
    }
    if (answering) { parts.push('t' + Math.floor(now() / 5000)); }
    return parts.join('|');
  },

  renderDash: function () {
    var panel = $('panelDash');
    if (!panel) { return; }
    clearNode(panel);
    var exx = Exam.data;
    var recs = this.list();
    var st = this.stats(exx, recs);
    this.dashSig = this.sigOf(recs);

    panel.appendChild(this.dashTools(recs, st));
    panel.appendChild(this.kpiGrid(st));
    panel.appendChild(this.participantsCard(exx, recs));
    panel.appendChild(this.questionCard(st, recs.length));
  },

  stats: function (exam, recs) {
    var total = recs.length, answering = 0, submitted = 0, waiting = 0;
    var sum = 0, best = null, bestRec = null;
    for (var i = 0; i < recs.length; i++) {
      var r = recs[i];
      if (r.status === 'submitted') { submitted++; }
      else if (r.status === 'answering') { answering++; }
      else { waiting++; }
      if (r.status === 'submitted') {
        var ev = Model.evaluate(exam, r);
        sum += ev.earned;
        if (best === null || ev.earned > best) { best = ev.earned; bestRec = r; }
      }
    }
    var qs = (exam && exam.questions) || [], perQuestion = [];
    for (var qi = 0; qi < qs.length; qi++) {
      var q = qs[qi], ans = 0, cor = 0;
      for (var ri = 0; ri < recs.length; ri++) {
        var a = recs[ri].answers && recs[ri].answers[q.id];
        var j = Model.judge(q, a ? a.raw : null);
        if (j.answered) { ans++; if (j.correct) { cor++; } }
      }
      perQuestion.push({
        q: q, index: qi, answered: ans, correct: cor,
        rate: ans ? Math.round(cor / ans * 100) : 0
      });
    }
    return {
      total: total, answering: answering, submitted: submitted, waiting: waiting,
      avg: submitted ? Math.round(sum / submitted) : null,
      best: best, bestName: bestRec ? bestRec.name : '',
      perQuestion: perQuestion,
      maxPoints: Exam.totalPoints()
    };
  },

  dashTools: function (recs, st) {
    var self = this;
    this.dashTimeEl = el('span', { cls: 'hint', text: '마지막 갱신 ' + fmtHMS(now()) });
    var left = el('div', { cls: 'left' }, [
      el('span', { cls: 'live-dot' }, [el('i'), '실시간']),
      this.dashTimeEl
    ]);
    if (st) {
      left.appendChild(el('span', { cls: 'hint', text: '제출 완료 ' + st.submitted + ' / ' + st.total + '명' }));
    }
    var acts = [];
    if (Exam.data && Exam.data.status === 'running') {
      if (st && st.total > 0 && st.submitted === st.total) {
        acts.push(el('span', { cls: 'all-badge', text: '전원 제출 완료' }));
      }
      acts.push(btn('시험 종료 (정답 공개)', 'btn btn-ok btn-sm', function () { self.changeStatus('ended'); }, { attrs: { 'data-role': 'dash-end' } }));
    }
    acts.push(btn('CSV 내보내기', 'btn btn-soft btn-sm', function () { self.exportCsv(); }, { attrs: { 'data-role': 'csv' } }));
    acts.push(btn('새로고침', 'btn btn-sm', function () { self.renderDash(); }));
    return el('div', { cls: 'dash-tools' }, [left, el('div', { cls: 'left' }, acts)]);
  },

  kpiGrid: function (st) {
    function card(label, value, unit, sub, accent) {
      return el('div', { cls: 'kpi' + (accent ? ' is-accent' : '') }, [
        el('div', { cls: 'kpi-label', text: label }),
        el('div', { cls: 'kpi-value' }, [String(value), unit ? el('small', { text: unit }) : null]),
        el('div', { cls: 'kpi-sub', text: sub || '' })
      ]);
    }
    return el('div', { cls: 'kpis' }, [
      card('참여자 수', st.total, '명', st.waiting ? '대기 ' + st.waiting + '명 포함' : '초대 링크로 입장', true),
      card('응시 중', st.answering, '명', '지금 문제를 푸는 중'),
      card('제출 완료', st.submitted, '명', st.total ? Math.round(st.submitted / st.total * 100) + '% 제출' : '아직 없음'),
      card('평균 점수', st.avg === null ? '–' : st.avg, st.avg === null ? '' : '점', '제출자 기준'),
      card('최고 점수', st.best === null ? '–' : st.best, st.best === null ? '' : '점',
        st.best === null ? st.maxPoints + '점 만점' : (st.bestName + ' · ' + st.maxPoints + '점 만점'))
    ]);
  },

  participantsCard: function (exx, recs) {
    var self = this;
    var head = el('div', { cls: 'card-head' }, [
      el('h2', null, ['참여자', el('span', { cls: 'hint', text: recs.length ? recs.length + '명' : '' })]),
      el('span', { cls: 'hint', text: '실시간 자동 갱신' })
    ]);
    if (!recs.length) {
      return el('div', { cls: 'card' }, [head, el('div', { cls: 'empty' }, [
        el('b', { text: '아직 참여한 팀원이 없습니다.' }),
        el('p', { text: '팀원 초대 링크를 보내면 입장과 동시에 이 목록에 나타납니다.' }),
        el('div', { cls: 'empty-acts' }, [
          btn('시험 진행 탭으로', 'btn', function () { self.switchTab('run'); })
        ])
      ])]);
    }

    var table = el('div', { cls: 'ptable' }, [
      el('div', { cls: 'phead' }, [
        el('span', { text: '이름' }),
        el('span', { text: '진행률' }),
        el('span', { text: '상태' }),
        el('span', { text: '점수' }),
        el('span', { text: '정답률' }),
        el('span', { text: '소요시간' }),
        el('span', { text: '' })
      ])
    ]);
    for (var i = 0; i < recs.length; i++) {
      table.appendChild(this.participantRow(exx, recs[i]));
    }
    return el('div', { cls: 'card' }, [head, table]);
  },

  participantRow: function (exx, rec) {
    var self = this;
    var ev = Model.evaluate(exx, rec);
    var prog = progressOf(exx, rec);
    return el('div', { cls: 'prow' }, [
      el('div', { cls: 'pcell pname' }, [el('span', { cls: 'nm', text: rec.name || '이름 없음' })]),
      el('div', { cls: 'pcell' }, [
        el('span', { cls: 'plabel', text: '진행률' }),
        el('div', { cls: 'pbar-track' }, [el('div', { cls: 'pbar-fill', style: { width: prog + '%' } })]),
        el('span', { cls: 'psub', text: ev.answered + '/' + ev.total + ' 문항' })
      ]),
      el('div', { cls: 'pcell' }, [el('span', { cls: 'plabel', text: '상태' }), statusChip(rec)]),
      el('div', { cls: 'pcell' }, [
        el('span', { cls: 'plabel', text: '점수' }),
        el('span', { cls: 'pval big', text: rec.status === 'waiting' ? '–' : String(ev.earned) }),
        el('span', { cls: 'pval unit', text: ' / ' + ev.max })
      ]),
      el('div', { cls: 'pcell' }, [
        el('span', { cls: 'plabel', text: '정답률' }),
        el('span', { cls: 'pval', text: ev.correctRate + '%' }),
        el('span', { cls: 'psub', text: '정답 ' + ev.correct + '개' })
      ]),
      el('div', { cls: 'pcell' }, [
        el('span', { cls: 'plabel', text: '소요시간' }),
        el('span', { cls: 'pval', text: fmtDuration(ev.elapsed) }),
        el('span', { cls: 'psub', text: rec.status === 'submitted' ? '제출 완료' : '진행 중' })
      ]),
      el('div', { cls: 'pcell pacts' }, [
        btn('답안', 'btn btn-sm', function () { self.openDetail(rec.id); }, { attrs: { 'data-role': 'detail-' + rec.id } })
      ])
    ]);
  },

  questionCard: function (st, nRecs) {
    var body = el('div', { cls: 'qbars' });
    if (!st.perQuestion.length) {
      body.appendChild(el('p', { cls: 'hintline', text: '문항이 없습니다.' }));
    } else {
      for (var i = 0; i < st.perQuestion.length; i++) {
        var row = st.perQuestion[i];
        var rate = row.rate;
        var cls = 'qbar-fill' + (row.answered === 0 ? '' : (rate < 40 ? ' is-low' : (rate < 70 ? ' is-mid' : '')));
        body.appendChild(el('div', { cls: 'qbar' }, [
          el('div', { cls: 'qbar-top' }, [
            el('span', { cls: 'qbar-idx', text: String(i + 1) }),
            el('span', { cls: 'qbar-txt', text: row.q.text }),
            el('span', { cls: 'qbar-pct', text: row.answered ? rate + '%' : '–' })
          ]),
          el('div', { cls: 'qbar-track' }, [el('div', { cls: cls, style: { width: (row.answered ? rate : 0) + '%' } })]),
          el('div', { cls: 'qbar-sub', text: (TYPE_LABEL[row.q.type] || row.q.type) + ' · 정답 ' + row.correct + ' / 응답 ' + row.answered + ' · ' + (Number(row.q.points) || 0) + '점' })
        ]));
      }
    }
    return el('div', { cls: 'card' }, [
      el('div', { cls: 'card-head' }, [
        el('h2', { text: '문항별 정답률' }),
        el('span', { cls: 'hint', text: '참여자 ' + (nRecs ? nRecs + '명' : '0명') + ' 기준' })
      ]),
      el('div', { cls: 'card-body' }, [body])
    ]);
  },

  openDetail: function (pid) {
    var rec = this.recs[pid];
    if (!rec) { toast('참여자 정보를 찾을 수 없습니다.', 'warn'); return; }
    var exx = Exam.data;
    var ev = Model.evaluate(exx, rec);
    var body = el('div');

    body.appendChild(el('div', { cls: 'res-chips' }, [
      el('span', { cls: 'res-chip' }, ['점수 ', el('b', { text: String(ev.earned) }), ' / ' + ev.max]),
      el('span', { cls: 'res-chip' }, ['정답 ', el('b', { text: String(ev.correct) })]),
      el('span', { cls: 'res-chip' }, ['오답 ', el('b', { text: String(ev.wrong) })]),
      el('span', { cls: 'res-chip' }, ['미응답 ', el('b', { text: String(ev.missing) })]),
      el('span', { cls: 'res-chip' }, ['소요 ', el('b', { text: fmtDuration(ev.elapsed) })])
    ]));
    if (rec.status !== 'submitted') {
      body.appendChild(el('p', { cls: 'hintline', style: { marginTop: '10px' }, text: '아직 제출하지 않았습니다. 지금까지의 답안입니다.' }));
    } else if (rec.auto) {
      body.appendChild(el('p', { cls: 'hintline', style: { marginTop: '10px' }, text: '시험 종료 또는 시간 만료로 자동 제출되었습니다.' }));
    }

    var list = el('div', { style: { marginTop: '14px', border: '1px solid #eef1f7', borderRadius: '12px', overflow: 'hidden' } });
    for (var i = 0; i < ev.items.length; i++) {
      var it = ev.items[i];
      var q = it.q;
      var cls = it.correct ? 'rev rev-ok' : (it.answered ? 'rev rev-no' : 'rev rev-miss');
      var mark = it.correct ? '✓' : (it.answered ? '✕' : '–');
      var kids = [
        el('div', { cls: 'rev-head' }, [
          el('span', { cls: 'rev-mark', text: mark }),
          el('div', { cls: 'rev-q', text: (i + 1) + '. ' + q.text }),
          el('span', { cls: 'rev-pts', text: it.earned + '/' + it.points })
        ]),
        el('div', { cls: 'kv' }, [
          el('div', null, [el('span', { cls: 'k', text: '팀원 답' }), el('span', { cls: it.correct ? 'right' : (it.answered ? 'wrong' : 'mine'), text: it.answered ? Model.answerText(q, it.raw) : '미응답' })]),
          el('div', null, [el('span', { cls: 'k', text: '정답' }), el('span', { cls: 'right', text: Model.correctText(q) })])
        ])
      ];
      if (q.explain) { kids.push(el('div', { cls: 'explain', text: q.explain })); }
      list.appendChild(el('div', { cls: cls }, kids));
    }
    body.appendChild(list);

    Modal.open({
      title: (rec.name || '이름 없음') + ' 답안',
      body: body,
      wide: true,
      foot: [
        el('span', { cls: 'hint', text: Model.statusText(rec) + (rec.submittedAt ? ' · ' + fmtHMS(rec.submittedAt) : '') }),
        btn('닫기', 'btn', function () { Modal.close(); })
      ]
    });
  },

  exportCsv: function () {
    var recs = this.list();
    if (!recs.length) { toast('내보낼 결과가 없습니다.', 'warn'); return; }
    var name = csvFileName();
    if (downloadText(name, csvText(Exam.data, recs), 'text/csv;charset=utf-8')) {
      toast('CSV 파일(' + name + ') 다운로드를 시작했습니다.', 'ok');
    } else {
      toast('다운로드를 시작하지 못했습니다. 브라우저 설정을 확인해 주세요.', 'err');
    }
  }
};

/* 출제자 화면 시작 */
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', function () { Host.init(); });
} else {
  Host.init();
}

/* 검증·디버깅용 핸들: ?dev=1 또는 테스트 플래그가 있을 때만 노출한다. */
if (window.__TQ_TEST === true || getParam('dev') === '1') {
  window.__TQ = { Host: Host, Exam: Exam, Model: Model, FB: FB, LS: LS, KEYS: KEYS, toast: toast, Modal: Modal };
}
</script>
</body>
</html>
