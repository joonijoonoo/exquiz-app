<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6f9">
<meta name="color-scheme" content="light">
<meta name="description" content="익스퀴즈 팀원 응시 화면 — 이름 입력, 응시, 내 결과와 해설">
<title>익스퀴즈 · 응시</title>
<!-- 수식(제곱근·분수·지수) 렌더링. KaTeX가 늦게 오거나 오프라인이면 문제는 원문 텍스트로 보입니다. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
/* ==========================================================================
   익스퀴즈 — 스타일 (외부 리소스 0)
   ========================================================================== */
:root{
  --bg:#f4f6f9;
  --bg-grad-1:#eef3ff;
  --bg-grad-2:#f7f4ff;
  --card:#ffffff;
  --ink:#1a2233;
  --ink-soft:#3d4757;
  --muted:#78849a;
  --line:#e8ebf1;
  --line-soft:#f0f2f7;
  --accent:#3b6ef6;
  --accent-dark:#2f59c9;
  --accent-soft:#eaf0ff;
  --ok:#0ea36b;
  --ok-soft:#e6f7ef;
  --warn:#e08c14;
  --warn-soft:#fdf3e1;
  --danger:#e2504a;
  --danger-soft:#fdecea;
  --radius:16px;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 10px 28px -12px rgba(16,24,40,.16);
  --shadow-lift:0 2px 4px rgba(16,24,40,.05), 0 18px 36px -18px rgba(16,24,40,.24);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1100px 520px at 12% -12%, var(--bg-grad-1) 0%, rgba(238,243,255,0) 62%),
    radial-gradient(900px 480px at 92% -6%, var(--bg-grad-2) 0%, rgba(247,244,255,0) 58%),
    var(--bg);
  background-attachment:fixed;
  color:var(--ink);
  font-family:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  font-size:15px;
  line-height:1.5;
  min-height:100vh;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;}
a{color:var(--accent-deep,#2f59c9);}
::placeholder{color:#a3adbf;}
[hidden]{display:none !important;}

/* ── 공통 ───────────────────────────────────────────── */
.app{min-height:100vh;display:flex;flex-direction:column;}
.shell{width:100%;max-width:1080px;margin:0 auto;padding:22px 20px 90px;flex:1 0 auto;}
.muted{color:var(--muted);}
.nowrap{white-space:nowrap;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}

/* 상단 바 */
.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:11px 20px;
  background:rgba(255,255,255,.88);
  -webkit-backdrop-filter:saturate(1.4) blur(12px);
  backdrop-filter:saturate(1.4) blur(12px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.brand-mark{
  width:34px;height:34px;flex:0 0 auto;border-radius:11px;
  background:linear-gradient(135deg,#3b6ef6 0%,#7a5cf0 100%);
  color:#fff;display:grid;place-items:center;
  font-weight:800;font-size:15px;letter-spacing:-.02em;
  box-shadow:0 7px 16px -8px rgba(59,110,246,.9);
}
.brand-text{display:flex;flex-direction:column;min-width:0;line-height:1.25;}
.brand-text strong{font-size:14.5px;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.brand-sub{
  font-size:12px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44vw;
}
.top-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto;}
.sync-badge{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11.5px;font-weight:650;color:#5b6577;
  background:#f2f5fa;border:1px solid #e3e8f1;border-radius:999px;padding:5px 10px;
  white-space:nowrap;
}
.sync-badge i{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(14,163,107,.14);}
.sync-badge.is-live{color:#087a51;background:var(--ok-soft);border-color:#cfeee0;}
.sync-badge.is-wait{color:#8a6a1e;background:var(--warn-soft);border-color:#f6e3bf;}
.sync-badge.is-poll{color:#8a6a1e;background:var(--warn-soft);border-color:#f6e3bf;}
.sync-badge.is-off{color:#b23a34;background:var(--danger-soft);border-color:#f6cfcb;}

/* 카드 */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow-sm);margin-bottom:16px;overflow:hidden;
}
.card-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:15px 18px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap;
}
.card-head h2{
  margin:0;font-size:14.5px;font-weight:750;letter-spacing:-.015em;
  display:flex;align-items:center;gap:8px;
}
.card-head .hint{font-size:12px;color:var(--muted);font-weight:600;}
.card-body{padding:16px 18px;}
.card-body.tight{padding:0;}
.card-foot{
  padding:13px 18px;border-top:1px solid var(--line-soft);background:#fbfcfe;
  display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;
}
.card-note{
  font-size:12.5px;color:var(--muted);line-height:1.6;
  background:#f8fafd;border:1px solid #edf1f7;border-radius:11px;padding:11px 12px;
}
.card-note b{color:var(--ink-soft);}

/* 버튼 */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:40px;padding:0 14px;border-radius:11px;
  border:1px solid var(--line);background:#fff;color:var(--ink);
  font-weight:650;font-size:14px;box-shadow:var(--shadow-sm);
  transition:background .15s,border-color .15s,transform .06s;white-space:nowrap;
}
.btn:hover{border-color:#d7deea;background:#fbfcff;}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 9px 20px -12px rgba(59,110,246,.9);}
.btn-primary:hover{background:var(--accent-dark);border-color:var(--accent-dark);}
.btn-soft{background:var(--accent-soft);border-color:#d8e3ff;color:var(--accent-dark);}
.btn-soft:hover{background:#e0e9ff;border-color:#c8d9ff;}
.btn-danger{background:#fff8f7;border-color:#f3d3d0;color:#c8413b;}
.btn-danger:hover{background:var(--danger-soft);border-color:#efb8b3;}
.btn-ok{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 9px 20px -12px rgba(14,163,107,.9);}
.btn-ok:hover{background:#0b8b5b;border-color:#0b8b5b;}
.btn-ghost{background:transparent;border-color:transparent;box-shadow:none;color:#5b6577;}
.btn-ghost:hover{background:#f1f4f9;}
.btn-sm{min-height:32px;padding:0 10px;font-size:12.5px;border-radius:9px;}
.btn-lg{min-height:50px;font-size:15.5px;border-radius:13px;font-weight:700;}
.btn-block{width:100%;}
.btn-icon{width:32px;min-height:32px;padding:0;font-size:14px;}
.btn[disabled]{opacity:.45;pointer-events:none;box-shadow:none;}

/* 폼 */
.field{display:flex;flex-direction:column;gap:6px;min-width:0;}
.label{font-size:12.5px;font-weight:650;color:#5b6577;}
.input,.textarea,.select{
  width:100%;min-height:42px;border:1px solid var(--line);border-radius:11px;
  padding:10px 12px;background:#fff;color:var(--ink);outline:none;
  transition:border-color .15s,box-shadow .15s;
}
.input:focus,.textarea:focus,.select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.textarea{min-height:78px;resize:vertical;line-height:1.6;}
.input[readonly]{background:#f8fafd;color:#4b5666;font-size:13px;}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;}
.row > *{flex:1 1 160px;min-width:0;}
.row.tight{gap:8px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.hintline{font-size:12px;color:var(--muted);line-height:1.55;}
.errline{font-size:12.5px;color:var(--danger);font-weight:650;}
.saveline{font-size:11.5px;color:var(--ok);font-weight:700;opacity:0;transition:opacity .3s;margin-left:8px;}
.saveline.on{opacity:1;}

/* 문항 진행 표시 (출제자·팀원 공통) */
.psub{display:block;font-size:11px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap;}

/* pill / tag */
.pill{
  display:inline-flex;align-items:center;gap:6px;border-radius:999px;
  padding:6px 12px;font-size:12.5px;font-weight:700;border:1px solid transparent;white-space:nowrap;
}
.pill .dotp{width:6px;height:6px;border-radius:50%;background:currentColor;}
.pill.is-waiting{background:#f1f4f9;color:#5b6577;border-color:#e3e8f1;}
.pill.is-running{background:var(--accent-soft);color:var(--accent-dark);border-color:#d6e2ff;}
.pill.is-running .dotp{animation:pulse 1.5s infinite;}
.pill.is-ended{background:#eef0f4;color:#3d4757;border-color:#e0e4ec;}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(59,110,246,.5);}
  70%{box-shadow:0 0 0 6px rgba(59,110,246,0);}
  100%{box-shadow:0 0 0 0 rgba(59,110,246,0);}
}
.tag{
  display:inline-flex;align-items:center;gap:4px;border-radius:7px;
  padding:2px 7px;font-size:11px;font-weight:700;line-height:1.6;
  background:#f1f4f9;color:#5b6577;border:1px solid #e6ebf3;white-space:nowrap;
}
.tag-mcq{background:#eef3ff;color:#2f59c9;border-color:#dbe6ff;}
.tag-ox{background:#f6efff;color:#6b3ec9;border-color:#e9dcff;}
.tag-short{background:#e9f8f1;color:#087a51;border-color:#cfeee0;}
.tag-pts{background:#fff6e6;color:#9a6100;border-color:#f8e6c4;}
.tag-virtual{background:#f4f1ff;color:#5b3ec9;border-color:#e5defc;}
.tag-test{background:#eef7ff;color:#1d6fa5;border-color:#d7ebfa;}

/* ── 모달 / 토스트 ──────────────────────────────────── */
.modal-back{
  position:fixed;inset:0;z-index:90;background:rgba(16,24,40,.44);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:20px;
  animation:fade .15s;
}
.modal{
  width:100%;max-width:560px;max-height:88vh;display:flex;flex-direction:column;
  background:#fff;border-radius:18px;box-shadow:0 30px 70px -22px rgba(16,24,40,.55);
  overflow:hidden;animation:pop .18s;
}
.modal.is-wide{max-width:700px;}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:15px 18px;border-bottom:1px solid var(--line-soft);flex:0 0 auto;
}
.modal-head h3{margin:0;font-size:15.5px;font-weight:750;letter-spacing:-.015em;overflow-wrap:anywhere;}
.modal-body{padding:18px;overflow-y:auto;flex:1 1 auto;-webkit-overflow-scrolling:touch;}
.modal-foot{
  display:flex;gap:8px;justify-content:flex-end;padding:13px 18px;
  border-top:1px solid var(--line-soft);background:#fbfcfe;flex-wrap:wrap;flex:0 0 auto;
}
.modal-foot .errline{margin-right:auto;align-self:center;}
@media (max-width:640px){
  .modal-back{align-items:flex-end;padding:0;}
  .modal{max-width:none;border-radius:20px 20px 0 0;max-height:92vh;}
  .modal-foot{padding-bottom:calc(13px + env(safe-area-inset-bottom));}
}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
@keyframes pop{from{opacity:0;transform:translateY(4px) scale(.985);}to{opacity:1;transform:none;}}

.toasts{
  position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));z-index:130;
  display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 16px;pointer-events:none;
}
.toast{
  max-width:430px;text-align:center;background:#1f2733;color:#fff;
  font-size:13.5px;font-weight:600;padding:11px 16px;border-radius:12px;
  box-shadow:0 14px 32px -14px rgba(16,24,40,.7);animation:rise .2s;
  transition:opacity .25s,transform .25s;word-break:keep-all;
}
.toast.is-out{opacity:0;transform:translateY(6px);}
.toast-ok{background:#0d7a55;}
.toast-warn{background:#8f5606;}
.toast-err{background:#b23a34;}
@keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

/* ── 응시 화면 ──────────────────────────────────────── */
.member{max-width:660px;margin:0 auto;}
.m-card{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;
}
.m-pad{padding:20px;}
@media (max-width:520px){.m-pad{padding:16px;}}
.m-title{margin:0 0 6px;font-size:21px;font-weight:800;letter-spacing:-.025em;line-height:1.3;overflow-wrap:anywhere;}
.m-sub{margin:0;font-size:13px;color:var(--muted);line-height:1.6;}
.m-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;}
.m-step{
  font-size:11.5px;font-weight:750;color:var(--accent-dark);background:var(--accent-soft);
  border:1px solid #d9e3ff;border-radius:999px;padding:4px 9px;display:inline-flex;align-items:center;
}
.join-form{margin-top:18px;}
.q-top{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
.q-count{font-size:12.5px;font-weight:750;color:#5b6577;font-variant-numeric:tabular-nums;}
.q-count b{color:var(--ink);font-size:14px;}
.timer{
  margin-left:auto;display:inline-flex;align-items:center;gap:6px;
  font-size:12.5px;font-weight:750;color:#3d4757;background:#f2f5fa;
  border:1px solid #e3e8f1;border-radius:999px;padding:5px 11px;font-variant-numeric:tabular-nums;
}
.timer.is-urgent{background:var(--danger-soft);border-color:#f6cfcb;color:#b23a34;}
.timer.is-none{color:var(--muted);}
.qprog{display:flex;align-items:center;gap:0;margin-bottom:6px;}
.qprog-track{flex:1;height:7px;border-radius:999px;background:#e7ecf4;overflow:hidden;}
.qprog-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#3b6ef6,#7a5cf0);transition:width .25s;}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;}
.dot-btn{
  width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:#fff;
  font-size:12px;font-weight:750;color:#5b6577;font-variant-numeric:tabular-nums;
}
.dot-btn.is-ans{background:var(--ok-soft);border-color:#bfe9d7;color:#087a51;}
.dot-btn.is-cur{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);color:var(--accent-dark);}
.q-body{font-size:17px;font-weight:700;line-height:1.5;letter-spacing:-.01em;margin:14px 0 18px;overflow-wrap:anywhere;}
@media (max-width:520px){.q-body{font-size:16px;}}
.opt{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  border:1.5px solid var(--line);background:#fff;border-radius:13px;padding:13px 15px;
  font-size:14.5px;font-weight:600;min-height:54px;transition:border-color .12s,background .12s;
  color:var(--ink);line-height:1.4;
}
.opt + .opt{margin-top:8px;}
.opt:hover{border-color:#cfd9ea;background:#fbfcff;}
.opt.is-sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px rgba(59,110,246,.1);}
.opt-key{
  width:26px;height:26px;flex:0 0 auto;border-radius:8px;background:#f1f4f9;color:#5b6577;
  font-size:12.5px;font-weight:800;display:grid;place-items:center;
}
.opt.is-sel .opt-key{background:var(--accent);color:#fff;}
.opt-text{flex:1;min-width:0;overflow-wrap:anywhere;}
.oxwrap{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.oxbtn{
  min-height:104px;border-radius:16px;border:1.5px solid var(--line);background:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-size:34px;font-weight:800;color:var(--ink-soft);
}
.oxbtn small{font-size:12px;font-weight:650;color:var(--muted);}
.oxbtn.is-sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-dark);}
.oxbtn.is-sel small{color:var(--accent-dark);}
.shortin{
  width:100%;min-height:54px;border:1.5px solid var(--line);border-radius:13px;
  padding:13px 15px;font-size:15.5px;font-weight:650;outline:none;
}
.shortin:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.short-hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5;}
.m-nav{display:flex;gap:8px;margin-top:18px;}
.m-nav .btn{flex:1 1 0;}
.m-nav .btn-next{flex:1.6 1 0;}

.wait-orb{
  width:54px;height:54px;border-radius:50%;margin:0 auto 14px;
  background:radial-gradient(circle at 32% 30%,#dfe9ff,#b9ccff);
  box-shadow:0 0 0 10px rgba(59,110,246,.08);
  animation:breathe 2.4s ease-in-out infinite;
}
@keyframes breathe{0%,100%{transform:scale(.94);opacity:.85;}50%{transform:scale(1);opacity:1;}}
.wait{text-align:center;padding:26px 20px 30px;}
.wait h2{margin:0 0 6px;font-size:17px;font-weight:800;letter-spacing:-.02em;}
.wait p{margin:0;font-size:13px;color:var(--muted);line-height:1.65;}

/* 결과 */
.score-hero{
  display:flex;align-items:center;gap:18px;padding:20px;
  background:linear-gradient(135deg,#f4f8ff 0%,#ffffff 60%);
  border-bottom:1px solid var(--line-soft);flex-wrap:wrap;
}
.score-num{display:flex;align-items:baseline;gap:3px;font-variant-numeric:tabular-nums;}
.score-num b{font-size:40px;font-weight:850;letter-spacing:-.04em;line-height:1;}
.score-num span{font-size:14px;font-weight:700;color:var(--muted);}
.score-meta{flex:1;min-width:150px;}
.score-title{font-size:15px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:7px;}
.res-chips{display:flex;gap:6px;flex-wrap:wrap;}
.res-chip{
  font-size:11.5px;font-weight:700;color:#5b6577;background:#fff;
  border:1px solid var(--line);border-radius:999px;padding:4px 9px;font-variant-numeric:tabular-nums;
}
.res-chip b{color:var(--ink);}
.privacy-note{
  display:flex;gap:8px;align-items:flex-start;font-size:12px;color:#4b5666;line-height:1.6;
  background:#f8fafd;border:1px solid #edf1f7;border-radius:11px;padding:11px 12px;margin:14px 18px 0;
}
.privacy-note i{
  flex:0 0 auto;width:16px;height:16px;border-radius:50%;background:var(--ok-soft);color:#087a51;
  font-size:10px;font-style:normal;font-weight:800;display:grid;place-items:center;margin-top:1px;
}
.rev{border-top:1px solid var(--line-soft);padding:14px 18px;}
.rev:first-child{border-top:0;}
.rev-head{display:flex;gap:9px;align-items:flex-start;}
.rev-mark{
  width:22px;height:22px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;
  font-size:11px;font-weight:800;margin-top:1px;
}
.rev-ok .rev-mark{background:var(--ok-soft);color:#087a51;}
.rev-no .rev-mark{background:var(--danger-soft);color:#b23a34;}
.rev-miss .rev-mark{background:#f1f4f9;color:#5b6577;}
.rev-q{font-size:13.5px;font-weight:700;line-height:1.45;flex:1;min-width:0;overflow-wrap:anywhere;}
.rev-pts{font-size:11.5px;font-weight:750;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;}
.kv{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12.5px;color:#4b5666;}
.kv div{display:flex;gap:5px;align-items:baseline;}
.kv .k{color:var(--muted);font-weight:650;font-size:11.5px;}
.kv .mine{font-weight:700;color:#3d4757;}
.kv .right{font-weight:750;color:#087a51;}

<script>
/* =========================================================================
   익스퀴즈 — 공통 코어: 유틸 · 저장 · 시험 모델 · 채점 · CSV
   (출제자 파일과 팀원 파일이 함께 쓰는 코드만 여기에 둔다)
   ========================================================================= */

var APP_NAME = '익스퀴즈';
/* 예전 이름이 기본값으로 저장된 시험은 새 이름으로 옮긴다. */
var LEGACY_APP_TITLES = ['제품교육 퀴즈대잔치', '제품교육 퀴즈대찬치'];
var DB_BASE = 'https://quiz-62490-default-rtdb.asia-southeast1.firebasedatabase.app';
/* 방(초대 코드)별로 시험과 응시 기록을 나눠 둔다. 루트는 잠그고 /rooms/{코드}만 연다. */
var DB_PATH = {
  room: function (code) { return '/rooms/' + code; },
  exam: function (code) { return '/rooms/' + code + '/exam'; },
  participants: function (code) { return '/rooms/' + code + '/participants'; },
  participant: function (code, id) { return '/rooms/' + code + '/participants/' + id; }
};
var KEYS = {
  myId: 'quiz:myId',
  name: 'quiz:myName',
  invite: 'quiz:inviteUrl',
  room: 'quiz:roomCode',
  prevRoom: 'quiz:prevRoom',
  memberRoom: 'quiz:memberRoom',
  tab: 'quiz:hostTab',
  guide: 'quiz:guideOff',
  goal: 'quiz:goalCount',
  draft: 'quiz:draft:'
};

/* ---------------------------------------------------------- 초대 코드 */
var ROOM_PREFIX = 'EXQ-';
var ROOM_MIN = 3, ROOM_MAX = 24;
var ROOM_ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; /* 0/O, 1/I처럼 헷갈리는 글자 제외 */
var ROOM_CODE_ERROR = '유효하지 않은 초대 코드입니다. 출제자에게 다시 확인해 주세요.';
var RoomCode = {
  /* 입력값 정리: 공백 제거 + 대문자 통일 (대소문자는 구분하지 않는다) */
  normalize: function (raw) {
    return String(raw == null ? '' : raw).replace(/[\s\u200b\ufeff]+/g, '').toUpperCase();
  },
  valid: function (code) {
    var c = String(code == null ? '' : code);
    if (c.length < ROOM_MIN || c.length > ROOM_MAX) { return false; }
    return /^[A-Z0-9][A-Z0-9_-]*$/.test(c);
  },
  random: function () {
    var s = '';
    for (var i = 0; i < 6; i++) { s += ROOM_ALPHABET.charAt(randInt(0, ROOM_ALPHABET.length - 1)); }
    return ROOM_PREFIX + s;
  }
};

/* 응시용 주소에 초대 코드를 붙인다. (이미 code=가 있으면 값만 바꾼다) */
function withCode(url, code) {
  var base = String(url == null ? '' : url).trim();
  if (!base) { return ''; }
  var hash = '', hi = base.indexOf('#');
  if (hi >= 0) { hash = base.slice(hi); base = base.slice(0, hi); }
  var pair = 'code=' + encodeURIComponent(code);
  var qi = base.indexOf('?');
  if (qi >= 0) {
    var kept = [], parts = base.slice(qi + 1).split('&');
    for (var i = 0; i < parts.length; i++) {
      if (parts[i] && parts[i].indexOf('code=') !== 0) { kept.push(parts[i]); }
    }
    kept.push(pair);
    return base.slice(0, qi) + '?' + kept.join('&') + hash;
  }
  return base + '?' + pair + hash;
}
var TYPE_LABEL = { mcq: '5지선다', ox: 'OX', short: '단답형' };
var TYPE_TAG = { mcq: 'tag-mcq', ox: 'tag-ox', short: 'tag-short' };
var STATUS_LABEL = { waiting: '대기 중', running: '진행 중', ended: '종료' };
var P_STATUS_LABEL = { waiting: '대기 중', answering: '응시 중', submitted: '제출 완료' };
var CIRCLED = ['①', '②', '③', '④', '⑤'];

/* ---------------------------------------------------------------- 유틸 */
function $(id) { return document.getElementById(id); }
function now() { return Date.now(); }
function pad2(n) { n = String(n); return n.length < 2 ? '0' + n : n; }
function hasOwn(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }
function clone(obj) { return JSON.parse(JSON.stringify(obj)); }
function uid(prefix) {
  return (prefix || 'id') + '_' + now().toString(36) + Math.random().toString(36).slice(2, 6);
}
function randInt(min, max) { return Math.floor(min + Math.random() * (max - min + 1)); }
function fmtClock(ms) {
  ms = Math.max(0, ms || 0);
  var total = Math.floor(ms / 1000);
  var h = Math.floor(total / 3600);
  var m = Math.floor((total % 3600) / 60);
  var s = total % 60;
  return h > 0 ? h + ':' + pad2(m) + ':' + pad2(s) : pad2(m) + ':' + pad2(s);
}
function fmtDuration(ms) {
  ms = Math.max(0, ms || 0);
  var total = Math.floor(ms / 1000);
  var h = Math.floor(total / 3600);
  var m = Math.floor((total % 3600) / 60);
  var s = total % 60;
  if (h > 0) { return h + '시간 ' + m + '분'; }
  if (m > 0) { return m + '분 ' + pad2(s) + '초'; }
  return s + '초';
}
function fmtHM(ts) {
  if (!ts) { return '-'; }
  var d = new Date(ts);
  return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
function fmtHMS(ts) {
  if (!ts) { return '-'; }
  var d = new Date(ts);
  return pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
}
function fmtDate(ts) {
  var d = new Date(ts);
  return String(d.getFullYear()) + pad2(d.getMonth() + 1) + pad2(d.getDate());
}
function fmtDateTime(ts) {
  if (!ts) { return ''; }
  var d = new Date(ts);
  return String(d.getFullYear()) + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) +
    ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
function debounce(fn, ms) {
  var t = null;
  return function () {
    var ctx = this, args = arguments;
    if (t) { clearTimeout(t); }
    t = setTimeout(function () { t = null; fn.apply(ctx, args); }, ms);
  };
}
function getParam(name) {
  var q = String((window.location && window.location.search) || '');
  if (q.charAt(0) === '?') { q = q.slice(1); }
  var parts = q.split('&');
  for (var i = 0; i < parts.length; i++) {
    var pair = parts[i].split('=');
    if (decodeURIComponent(pair[0] || '') === name) {
      return decodeURIComponent((pair[1] || '').replace(/\+/g, ' '));
    }
  }
  return '';
}
function paintBrandTitle(title) {
  var t = String(title || '').trim() || APP_NAME;
  try { document.title = (t === APP_NAME ? APP_NAME : t + ' · ' + APP_NAME); } catch (e) { /* 무시 */ }
}

/* ---------------------------------------------------------- 수식 렌더링 */
/* 문제·보기·해설의 $...$(인라인) · $$...$$(블록)을 KaTeX로 그린다.
   KaTeX는 CDN에서 늦게 도착할 수 있으므로, 아직 없거나 오프라인이면 원문 텍스트를 그대로 보여 준다. */
var RichText = {
  cache: {},

  available: function () {
    return !!(window.katex && typeof window.katex.renderToString === 'function');
  },

  /* 텍스트를 일반 조각과 수식 조각으로 나눈다.
     - \$ 는 글자 그대로의 달러로 본다.
     - 여는 $ 바로 뒤가 공백·$이거나, 닫는 $ 바로 앞이 공백이면 수식이 아니라 글자로 본다.
       ("가격은 $5 입니다" 처럼 $를 가격에 쓸 때 수식으로 오인하지 않게) */
  split: function (text) {
    var s = String(text == null ? '' : text);
    var out = [], buf = '', i = 0, n = s.length;
    while (i < n) {
      var ch = s.charAt(i);
      if (ch === '\\' && s.charAt(i + 1) === '$') { buf += '$'; i += 2; continue; }
      if (ch === '$') {
        var display = s.charAt(i + 1) === '$';
        var mark = display ? '$$' : '$';
        var after = s.charAt(i + mark.length);
        var close = s.indexOf(mark, i + mark.length);
        if (after && after !== '$' && !/\s/.test(after) && close > i + mark.length) {
          var before = s.charAt(close - 1);
          var post = s.charAt(close + mark.length);
          var closed = !!before && !/\s/.test(before) && (display || !/[0-9]/.test(post));
          var body = s.slice(i + mark.length, close);
          /* 인라인 수식 안의 줄바꿈은 수식으로 보지 않고 원문 그대로 둔다. */
          if (closed && (display || body.indexOf('\n') < 0)) {
            if (buf) { out.push({ math: false, text: buf }); buf = ''; }
            out.push({ math: true, display: display, text: body });
            i = close + mark.length;
            continue;
          }
        }
      }
      buf += ch;
      i++;
    }
    if (buf) { out.push({ math: false, text: buf }); }
    return out;
  },

  /* 수식 하나를 KaTeX HTML로 그린다(같은 수식은 한 번만). 실패하면 빈 문자열. */
  html: function (tex, display) {
    var key = (display ? 'B' : 'I') + tex;
    if (hasOwn(this.cache, key)) { return this.cache[key]; }
    var out = '';
    try {
      out = String(window.katex.renderToString(tex, {
        displayMode: !!display,
        throwOnError: false,
        strict: false,
        trust: false
      }));
    } catch (e) { out = ''; }
    this.cache[key] = out;
    return out;
  },

  /* 노드에 원문(text)을 그린다. 일반 글자는 createTextNode로만 넣는다(innerHTML은 KaTeX 출력 전용). */
  render: function (node, text, opts) {
    if (!node) { return node; }
    var raw = String(text == null ? '' : text);
    var inline = !!(opts && opts.inline);
    /* KaTeX가 늦게 도착하면 다시 그릴 수 있게 원문을 기억해 둔다. */
    node.__richText = raw;
    node.__richInline = inline;
    clearNode(node);
    addClass(node, inline ? 'rt rt-inline' : 'rt');
    var segs = this.split(raw), hasMath = false;
    for (var i = 0; i < segs.length; i++) { if (segs[i].math) { hasMath = true; } }
    if (!hasMath || !this.available()) {
      /* 수식이 없거나 KaTeX가 아직 없을 때: 원문 텍스트를 그대로(줄바꿈은 CSS pre-wrap으로 유지) */
      node.appendChild(document.createTextNode(raw));
      return node;
    }
    for (var j = 0; j < segs.length; j++) {
      var seg = segs[j];
      if (!seg.math) { node.appendChild(document.createTextNode(seg.text)); continue; }
      var block = seg.display && !inline;
      var box = el(block ? 'div' : 'span', { cls: block ? 'math math-block' : 'math math-inline' });
      var html = this.html(seg.text, block);
      if (html) {
        box.setAttribute('data-math', '1');
        box.innerHTML = html;
      } else {
        box.appendChild(document.createTextNode((block ? '$$' : '$') + seg.text + (block ? '$$' : '$')));
      }
      node.appendChild(box);
    }
    return node;
  },

  /* KaTeX가 뒤늦게 로드되면 지금까지 그린 수식을 다시 그린다. */
  repaint: function (root) {
    if (!this.available()) { return 0; }
    var host = root || document;
    var list = host.querySelectorAll ? host.querySelectorAll('.rt') : [];
    var done = 0;
    for (var i = 0; i < list.length; i++) {
      var n = list[i];
      if (!n || !n.parentNode || String(n.__richText || '').indexOf('$') < 0) { continue; }
      this.render(n, n.__richText, { inline: n.__richInline });
      done++;
    }
    return done;
  }
};

/* 공용 헬퍼: 컨테이너에 수식 섞인 텍스트를 그린다. */
function renderRichText(container, text, opts) { return RichText.render(container, text, opts); }

function addClass(node, cls) {
  var parts = String(node.className || '').split(/\s+/);
  var add = String(cls || '').split(/\s+/), changed = false;
  for (var i = 0; i < add.length; i++) {
    if (!add[i] || parts.indexOf(add[i]) >= 0) { continue; }
    parts.push(add[i]);
    changed = true;
  }
  if (changed) { node.className = parts.join(' ').replace(/^\s+|\s+$/g, ''); }
}

/* defer로 늦게 오는 KaTeX를 기다렸다가 한 번 더 그린다. */
if (window.addEventListener) {
  window.addEventListener('DOMContentLoaded', function () { RichText.repaint(); });
  window.addEventListener('load', function () { RichText.repaint(); });
}

/* ------------------------------------------------------------- 저장소 */
var LS = (function () {
  var ok = false, mem = {};
  try {
    window.localStorage.setItem('quiz:__probe', '1');
    window.localStorage.removeItem('quiz:__probe');
    ok = true;
  } catch (e) { ok = false; }
  return {
    available: ok,
    get: function (k) {
      if (ok) { try { return window.localStorage.getItem(k); } catch (e) { /* 무시 */ } }
      return hasOwn(mem, k) ? mem[k] : null;
    },
    set: function (k, v) {
      if (ok) { try { window.localStorage.setItem(k, v); return; } catch (e) { /* 무시 */ } }
      mem[k] = String(v);
    },
    del: function (k) {
      if (ok) { try { window.localStorage.removeItem(k); } catch (e) { /* 무시 */ } }
      delete mem[k];
    },
    getJSON: function (k) {
      var raw = this.get(k);
      if (raw == null) { return null; }
      try { return JSON.parse(raw); } catch (e) { return null; }
    },
    setJSON: function (k, v) { this.set(k, JSON.stringify(v)); }
  };
})();

/* -------------------------------------------------------------- 시험 */
var Exam = {
  data: null,

  normalize: function (d) {
    var out = clone(d || {});
    var rawTitle = String(out.title == null ? '' : out.title).trim();
    out.title = (!rawTitle || LEGACY_APP_TITLES.indexOf(rawTitle) >= 0) ? APP_NAME : rawTitle;
    out.status = (out.status === 'running' || out.status === 'ended') ? out.status : 'waiting';
    var t = parseInt(out.timeLimitMin, 10);
    out.timeLimitMin = (isNaN(t) || t < 0) ? 0 : Math.min(300, t);
    if (out.startedAt == null) { out.startedAt = null; }
    if (out.endedAt == null) { out.endedAt = null; }
    out.updatedAt = Number(out.updatedAt) || 0;
    out.round = Math.max(1, parseInt(out.round, 10) || 1);
    var qs = [], list = out.questions || [];
    for (var i = 0; i < list.length; i++) {
      var q = list[i];
      if (!q || !String(q.text || '').trim()) { continue; }
      q.type = (q.type === 'ox' || q.type === 'short') ? q.type : 'mcq';
      q.points = Math.max(1, parseInt(q.points, 10) || 1);
      q.text = String(q.text);
      /* 단답형 전용: 정답 단어가 포함되면 정답 처리(기본 false) */
      if (q.type === 'short') { q.matchContains = q.matchContains === true; }
      else { delete q.matchContains; }
      qs.push(q);
    }
    out.questions = qs;
    return out;
  },
  load: function (d) {
    if (!d || !(d.questions instanceof Array)) { return false; }
    this.data = this.normalize(d);
    return true;
  },
  sig: function () { return JSON.stringify(this.data); },
  totalPoints: function () {
    var qs = (this.data && this.data.questions) || [], sum = 0;
    for (var i = 0; i < qs.length; i++) { sum += Number(qs[i].points) || 0; }
    return sum;
  },
  status: function () { return (this.data && this.data.status) || 'waiting'; },
  hasQuestions: function () { return !!(this.data && this.data.questions && this.data.questions.length); },
  find: function (qid) {
    var qs = (this.data && this.data.questions) || [];
    for (var i = 0; i < qs.length; i++) { if (qs[i].id === qid) { return i; } }
    return -1;
  },
  applyStatus: function (status) {
    var ex = this.data;
    if (!ex) { return; }
    if (ex.status === status && status !== 'running') { return; }
    ex.status = status;
    if (status === 'running') { ex.startedAt = now(); ex.endedAt = null; }
    else if (status === 'ended') { ex.endedAt = now(); }
    else { ex.startedAt = null; ex.endedAt = null; }
    ex.updatedAt = now();
  },
  remaining: function () {
    var ex = this.data;
    if (!ex || !ex.startedAt || ex.status !== 'running') { return null; }
    if (!ex.timeLimitMin || ex.timeLimitMin <= 0) { return -1; }
    return Math.max(0, ex.startedAt + ex.timeLimitMin * 60000 - now());
  }
};

/* -------------------------------------------------------------- 모델 */
var Model = {
  normShort: function (s, q) {
    var t = String(s == null ? '' : s);
    t = t.replace(/[\u200b\ufeff]/g, '').trim();
    if (q.ignoreSpace !== false) { t = t.replace(/[\s\u3000]+/g, ''); }
    if (q.ignoreCase !== false) { t = t.toLowerCase(); }
    return t;
  },
  isBlank: function (raw) {
    return raw === null || raw === undefined || String(raw).trim() === '';
  },
  judge: function (q, raw) {
    if (!q || this.isBlank(raw)) { return { answered: false, correct: false }; }
    if (q.type === 'mcq') {
      return { answered: true, correct: Number(raw) === Number(q.answer) };
    }
    if (q.type === 'ox') {
      return { answered: true, correct: String(raw).toUpperCase() === String(q.answer).toUpperCase() };
    }
    var list = q.shortAnswers || [], mine = this.normShort(raw, q);
    if (mine === '') { return { answered: false, correct: false }; }
    var contains = [];
    for (var i = 0; i < list.length; i++) {
      var normTarget = this.normShort(list[i], q);
      if (normTarget === '') { continue; }
      if (normTarget === mine) { return { answered: true, correct: true }; }
      if (q.matchContains === true) { contains.push(normTarget); }
    }
    /* 정답 단어가 포함되면 정답 처리 (예: '서울' → '서울특별시'도 정답) */
    for (var k = 0; k < contains.length; k++) {
      if (mine.indexOf(contains[k]) !== -1) { return { answered: true, correct: true }; }
    }
    return { answered: true, correct: false };
  },
  answerText: function (q, raw) {
    if (this.isBlank(raw)) { return ''; }
    if (q.type === 'mcq') {
      var i = Number(raw), c = (q.choices || [])[i];
      return c ? (CIRCLED[i] || String(i + 1)) + ' ' + c : String(raw);
    }
    if (q.type === 'ox') { return String(raw).toUpperCase(); }
    return String(raw);
  },
  correctText: function (q) {
    if (!q) { return ''; }
    if (q.type === 'mcq') {
      var i = Number(q.answer), c = (q.choices || [])[i];
      return c ? (CIRCLED[i] || String(i + 1)) + ' ' + c : '미지정';
    }
    if (q.type === 'ox') { return String(q.answer || '-').toUpperCase(); }
    var list = q.shortAnswers || [];
    return list.length ? list.join(' / ') : '미지정';
  },
  evaluate: function (exam, rec) {
    var qs = (exam && exam.questions) || [];
    var answers = (rec && rec.answers) || {};
    var items = [], answered = 0, correct = 0, earned = 0, max = 0;
    for (var i = 0; i < qs.length; i++) {
      var q = qs[i], pts = Number(q.points) || 0;
      max += pts;
      var a = answers[q.id];
      var raw = a ? a.raw : null;
      var j = this.judge(q, raw);
      if (j.answered) { answered++; }
      if (j.correct) { correct++; earned += pts; }
      items.push({
        q: q, raw: raw, answered: j.answered, correct: j.correct,
        points: pts, earned: j.correct ? pts : 0
      });
    }
    var started = (rec && (rec.startedAt || rec.joinedAt)) || now();
    var ended = (rec && rec.submittedAt) || now();
    return {
      items: items,
      total: qs.length,
      answered: answered,
      correct: correct,
      wrong: answered - correct,
      missing: qs.length - answered,
      earned: earned,
      max: max,
      correctRate: qs.length ? Math.round(correct / qs.length * 100) : 0,
      scoreRate: max ? Math.round(earned / max * 100) : 0,
      elapsed: Math.max(0, ended - started)
    };
  },
  grade: function (exam, rec) {
    var ev = this.evaluate(exam, rec);
    return {
      score: ev.earned,
      maxScore: ev.max,
      correctCount: ev.correct,
      durationSec: Math.round(ev.elapsed / 1000),
      answered: ev.answered
    };
  },
  blankRecord: function (id, name, exam) {
    return {
      id: id, name: name || '', status: 'waiting', answers: {},
      joinedAt: now(), startedAt: null, submittedAt: null,
      score: null, maxScore: Exam.totalPoints(), correctCount: null, durationSec: null,
      index: 0, lastSeen: now()
    };
  },
  statusText: function (rec) {
    if (!rec) { return '-'; }
    return P_STATUS_LABEL[rec.status] || '대기 중';
  }
};

/* CSV·진행률은 출제자 화면(host.js)에만 둔다. */

/* =========================================================================
   실시간 연동 — Firebase Realtime Database REST(fetch) + SSE(EventSource)
   · 읽기/쓰기: REST  <DB_BASE>/<path>.json
   · 구독: EventSource(SSE), 연결되지 않으면 2초 폴백 폴링
   ========================================================================= */

var FB = {
  base: DB_BASE,
  esOpen: 0,
  subs: 0,
  failed: false,
  state: 'connecting',
  _watchers: [],

  url: function (path) { return this.base + path + '.json'; },

  watch: function (fn) {
    this._watchers.push(fn);
    try { fn(this.state); } catch (e) { /* 무시 */ }
  },
  setState: function (s) {
    if (this.state === s) { return; }
    this.state = s;
    for (var i = 0; i < this._watchers.length; i++) {
      try { this._watchers[i](s); } catch (e) { /* 무시 */ }
    }
  },
  refresh: function () {
    if (this.esOpen > 0) { this.setState('live'); return; }
    if (this.failed) { this.setState('offline'); return; }
    if (this.subs > 0) { this.setState('polling'); return; }
    this.setState('connecting');
  },
  note: function (ok) {
    this.failed = !ok;
    this.refresh();
  },

  request: function (method, path, body, cb) {
    var url = this.url(path);
    var opts = { method: method, cache: 'no-store' };
    if (body !== undefined && body !== null && method !== 'GET' && method !== 'DELETE') {
      opts.headers = { 'Content-Type': 'application/json' };
      opts.body = JSON.stringify(body);
    }
    if (typeof window.fetch !== 'function') {
      this.note(false);
      if (cb) { cb('no-fetch', null); }
      return;
    }
    var self = this;
    try {
      window.fetch(url, opts).then(function (res) {
        var status = (res && res.status) || 0;
        return res.text().then(function (txt) {
          var data = null;
          try { data = txt ? JSON.parse(txt) : null; } catch (e) { data = null; }
          if (status >= 200 && status < 300) {
            self.note(true);
            if (cb) { cb(null, data); }
          } else {
            self.note(false);
            if (cb) { cb('http-' + status, data); }
          }
        });
      })['catch'](function () {
        self.note(false);
        if (cb) { cb('network', null); }
      });
    } catch (e) {
      this.note(false);
      if (cb) { cb('throw', null); }
    }
  },

  get: function (path, cb) { this.request('GET', path, null, cb); },
  put: function (path, value, cb) { this.request('PUT', path, value, cb); },
  patch: function (path, value, cb) { this.request('PATCH', path, value, cb); },
  del: function (path, cb) { this.request('DELETE', path, null, cb); },

  subscribe: function (path, onData) { return new FBSub(path, onData); }
};

/* Firebase가 보내는 경로 단위 변경(/a/b)을 로컬 사본에 반영한다. */
function setPath(root, path, value) {
  var parts = String(path || '').split('/');
  var node = root, i;
  for (i = 0; i < parts.length; i++) {
    if (parts[i] === '') { continue; }
    if (i === parts.length - 1) {
      if (value === null || value === undefined) { delete node[parts[i]]; }
      else { node[parts[i]] = value; }
      return root;
    }
    if (!node[parts[i]] || typeof node[parts[i]] !== 'object') { node[parts[i]] = {}; }
    node = node[parts[i]];
  }
  return root;
}

function FBSub(path, onData) {
  this.path = path;
  this.onData = onData;
  this.data = null;
  this.es = null;
  this.open = false;
  this.closed = false;
  this.retry = null;
  this.poll = null;
  FB.subs++;
  this.start();
}

FBSub.prototype.start = function () {
  var self = this;
  this.fetchNow();
  this.connect();
  this.poll = setInterval(function () { self.tick(); }, 2000);
};

FBSub.prototype.fetchNow = function () {
  var self = this;
  FB.get(this.path, function (err, data) {
    if (self.closed) { return; }
    if (err) { FB.note(false); return; }
    FB.note(true);
    self.deliver(data);
  });
};

FBSub.prototype.deliver = function (data) {
  this.data = data;
  try { this.onData(data); } catch (e) { if (window.console) { window.console.log(e); } }
};

FBSub.prototype.apply = function (name, raw) {
  var p = null;
  try { p = JSON.parse(raw); } catch (e) { return; }
  if (!p) { return; }
  if (name === 'patch') {
    var patch = p.data || {}, base = this.data;
    if (!base || typeof base !== 'object') { base = {}; }
    for (var k in patch) {
      if (hasOwn(patch, k)) { setPath(base, k, patch[k]); }
    }
    this.deliver(base);
    return;
  }
  if (name !== 'put' && name !== 'message') { return; }
  var path = p.path || '/';
  if (path === '/' || path === '') { this.deliver(p.data); return; }
  var root = this.data;
  if (!root || typeof root !== 'object') { root = {}; }
  setPath(root, path, p.data);
  this.deliver(root);
};

FBSub.prototype.connect = function () {
  var self = this;
  if (this.closed) { return; }
  if (typeof window.EventSource !== 'function') {
    this.open = false;
    FB.refresh();
    return;
  }
  var es = null;
  try { es = new window.EventSource(FB.url(this.path)); }
  catch (e) { es = null; }
  if (!es) {
    this.open = false;
    FB.note(false);
    this.retryLater();
    return;
  }
  this.es = es;
  es.onopen = function () {
    if (self.closed) { return; }
    if (!self.open) { self.open = true; FB.esOpen++; }
    FB.note(true);
  };
  es.onerror = function () {
    if (self.closed) { return; }
    self.drop();
    FB.refresh();
    self.retryLater();
  };
  es.onmessage = function (ev) { self.apply('message', ev && ev.data); };
  if (typeof es.addEventListener === 'function') {
    es.addEventListener('put', function (ev) { self.apply('put', ev && ev.data); });
    es.addEventListener('patch', function (ev) { self.apply('patch', ev && ev.data); });
  }
};

FBSub.prototype.drop = function () {
  if (this.open) { this.open = false; FB.esOpen = Math.max(0, FB.esOpen - 1); }
  if (this.es) { try { this.es.close(); } catch (e) { /* 무시 */ } this.es = null; }
};

FBSub.prototype.retryLater = function () {
  var self = this;
  if (this.closed || this.retry) { return; }
  this.retry = setTimeout(function () { self.retry = null; self.connect(); }, 5000);
};

/* SSE가 살아 있으면 폴링하지 않고, 끊긴 동안에만 2초마다 전체를 다시 읽는다. */
FBSub.prototype.tick = function () {
  if (this.closed || this.open) { return; }
  this.fetchNow();
};

FBSub.prototype.stop = function () {
  this.closed = true;
  this.drop();
  if (this.poll) { clearInterval(this.poll); this.poll = null; }
  if (this.retry) { clearTimeout(this.retry); this.retry = null; }
  FB.subs = Math.max(0, FB.subs - 1);
  FB.refresh();
};

/* =========================================================================
   공통 UI 조각 — DOM 생성 · 토스트 · 모달 · 복사 · 내려받기 · 상태 표시
   ========================================================================= */

function el(tag, opts, kids) {
  var node = document.createElement(tag);
  if (opts) {
    if (opts.cls) { node.className = opts.cls; }
    if (opts.id) { node.id = opts.id; }
    if (opts.text != null) { node.textContent = String(opts.text); }
    /* rich: 수식($...$, $$...$$)이 섞인 원문 텍스트 — core.js의 renderRichText로 그린다. */
    if (opts.rich != null) {
      renderRichText(node, opts.rich, opts.richOpts);
    }
    if (opts.type) { node.type = opts.type; }
    if (opts.value != null) { node.value = opts.value; }
    if (opts.placeholder != null) { node.placeholder = opts.placeholder; }
    if (opts.title != null) { node.title = opts.title; }
    if (opts.disabled != null) { node.disabled = !!opts.disabled; }
    if (opts.hidden != null) { node.hidden = !!opts.hidden; }
    if (opts.attrs) {
      for (var k in opts.attrs) {
        if (hasOwn(opts.attrs, k) && opts.attrs[k] != null) { node.setAttribute(k, String(opts.attrs[k])); }
      }
    }
    if (opts.style) {
      for (var s in opts.style) {
        if (hasOwn(opts.style, s)) { node.style[s] = opts.style[s]; }
      }
    }
    if (opts.dataset) {
      for (var d in opts.dataset) {
        if (hasOwn(opts.dataset, d)) { node.dataset[d] = String(opts.dataset[d]); }
      }
    }
    if (opts.on) {
      for (var e in opts.on) {
        if (hasOwn(opts.on, e)) { node.addEventListener(e, opts.on[e]); }
      }
    }
  }
  appendKids(node, kids);
  return node;
}

function appendKids(node, kids) {
  if (kids == null || kids === false) { return node; }
  if (typeof kids === 'string' || typeof kids === 'number') {
    node.appendChild(document.createTextNode(String(kids)));
    return node;
  }
  if (kids.nodeType) { node.appendChild(kids); return node; }
  if (typeof kids.length === 'number') {
    for (var i = 0; i < kids.length; i++) { appendKids(node, kids[i]); }
    return node;
  }
  return node;
}

function clearNode(node) {
  if (!node) { return; }
  while (node.firstChild) { node.removeChild(node.firstChild); }
}

function btn(label, cls, onClick, opts) {
  var o = { cls: cls || 'btn', type: 'button', text: label, on: onClick ? { click: onClick } : null };
  if (opts) {
    if (opts.title) { o.title = opts.title; }
    if (opts.attrs) { o.attrs = opts.attrs; }
    if (opts.disabled != null) { o.disabled = opts.disabled; }
    if (opts.id) { o.id = opts.id; }
  }
  return el('button', o);
}

function tagNode(text, cls) { return el('span', { cls: 'tag ' + (cls || ''), text: text }); }
function hintNode(text, cls) { return el('p', { cls: cls || 'hintline', text: text }); }

/* ------------------------------------------------------- 연결 상태 배지 */
function paintSync(state) {

    offline: ['is-off', '🔴 연결 끊김 · 재시도 중', 'DB에 연결하지 못했습니다. 네트워크를 확인해 주세요']

/* --------------------------------------------------------------- 토스트 */
function toast(msg, kind) {

  if (!root) { return; }
  var node = el('div', { cls: 'toast' + (kind ? ' toast-' + kind : ''), text: msg });
  root.appendChild(node);
  setTimeout(function () {
    node.className = node.className + ' is-out';
    setTimeout(function () { if (node.parentNode) { node.parentNode.removeChild(node); } }, 280);
  }, 2400);
}

/* --------------------------------------------------------------- 모달 */
var Modal = {
  back: null,
  close: function () {
    if (this.back && this.back.parentNode) { this.back.parentNode.removeChild(this.back); }
    this.back = null;
    if (document.body) { document.body.className = ''; }
  },
  open: function (opts) {
    this.close();
    var self = this;
    if (document.body) { document.body.className = 'modal-open'; }
    var head = el('div', { cls: 'modal-head' }, [
      el('h3', { text: opts.title || '' }),
      btn('✕', 'btn btn-ghost btn-sm', function () { self.close(); }, { attrs: { 'aria-label': '닫기' } })
    ]);
    var body = el('div', { cls: 'modal-body' }, opts.body || null);
    var box = el('div', { cls: 'modal' + (opts.wide ? ' is-wide' : '') }, [head, body]);
    if (opts.foot) { box.appendChild(el('div', { cls: 'modal-foot' }, opts.foot)); }
    var back = el('div', { cls: 'modal-back' }, [box]);
    if (opts.static !== true) {
      back.addEventListener('click', function (ev) {
        if (ev && ev.target === back) { self.close(); }
      });
    }
    document.body.appendChild(back);
    this.back = back;
    if (opts.focus) {
      setTimeout(function () { try { opts.focus.focus(); } catch (e) { /* 무시 */ } }, 30);
    }
    return { close: function () { self.close(); }, body: body };
  }
};

function confirmAsk(opts, onOk) {
  var okCls = opts.danger ? 'btn btn-danger' : 'btn btn-primary';
  var m = Modal.open({
    title: opts.title || '확인',
