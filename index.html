      opts.detail ? el('p', { cls: 'hintline', text: opts.detail }) : null
    ]),
    foot: [
      btn('취소', 'btn', function () { m.close(); }),
      btn(opts.okLabel || '확인', okCls, function () { m.close(); onOk(); })
    ]
  });
  return m;
}

/* ------------------------------------------------------------- 클립보드 */
function copyText(text, done) {
  function fallback() {
    var ok = false;
    var ta = el('textarea', { cls: 'textarea', value: text });
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    try {
      ta.focus();
      ta.select();
      if (document.execCommand) { ok = document.execCommand('copy'); }
    } catch (e) { ok = false; }
    if (ta.parentNode) { ta.parentNode.removeChild(ta); }
    done(!!ok);
  }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { fallback(); });
      return;
    }
  } catch (e) { /* fallback */ }
  fallback();
}

/* --------------------------------------------------------- 파일 내려받기 */
function downloadText(filename, text, mime) {
  try {
    var blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = el('a', { attrs: { href: url, download: filename } });
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { try { URL.revokeObjectURL(url); } catch (e) { /* 무시 */ } }, 1500);
    return true;
  } catch (e) {
    return false;
  }
}

/* 상태 배지·CSV는 출제자 화면(host.js)에만 둔다. */

/* =========================================================================
   팀원 응시 전용 화면 — 참여 · 대기실 · 응시 · 내 결과/해설
   (출제 기능·다른 참여자 정보는 이 파일에 존재하지 않는다)
   ========================================================================= */

function clampIdx(i, len) {
  i = Number(i) || 0;
  if (len <= 0) { return 0; }
  if (i < 0) { return 0; }
  if (i > len - 1) { return len - 1; }
  return i;
}

var Member = {
  myId: null,
  roomCode: '',
  pendingCode: '',
  rec: null,
  screen: 'loading',
  idx: 0,
  subExam: null,
  ready: false,
  saveTimer: null,
  pendingPut: false,
  lastPut: 0,
  lastSync: 0,
  examSig: '',
  examStatus: '',
  timerEl: null,
  optRefs: [],
  dotRefs: [],
  booted: false,
  offline: false,
  checking: false,
  codeError: '',
  lastRetry: 0,

  /* ---------------------------------------------------------- 시작 */
  init: function () {
    FB.watch(paintSync);
    this.stopSub();
    var id = LS.get(KEYS.myId);
    if (!id) { id = uid('u'); LS.set(KEYS.myId, id); }
    this.myId = id;
    this.startTick();
    /* 주소의 ?code= → 이 기기에서 마지막으로 입장한 코드 순서로 시도한다. */
    var code = RoomCode.normalize(getParam('code') || LS.get(KEYS.memberRoom) || '');
    if (!code) { this.toLock(''); return; }
    this.enterRoom(code);
  },

  startTick: function () {
    var self = this;
    if (this.booted) { return; }
    this.booted = true;
    setInterval(function () { self.tick(); }, 1000);
    document.addEventListener('keydown', function (ev) {
      if (ev && (ev.key === 'Escape' || ev.keyCode === 27)) { Modal.close(); }
    });
  },

  stopSub: function () {
    if (this.subExam) { this.subExam.stop(); this.subExam = null; }
  },

  /* 코드 없이 들어온 화면 — 시험 제목·문항은 절대 보여주지 않는다. */
  toLock: function (msg) {
    this.stopSub();
    this.roomCode = '';
    this.pendingCode = '';
    this.rec = null;
    this.ready = true;
    this.checking = false;
    this.offline = false;
    this.examSig = '';
    this.examStatus = '';
    this.idx = 0;
    Exam.data = null;
    this.codeError = msg || '';
    this.screen = 'lock';
    this.render();
  },

  /* 초대 코드 확인 → 방의 시험을 읽고 입장한다. */
  enterRoom: function (raw, quiet) {
    var self = this;
    var code = RoomCode.normalize(raw);
    if (!RoomCode.valid(code)) { this.toLock(ROOM_CODE_ERROR); return; }

    this.stopSub();
    this.ready = false;
    this.offline = false;
    this.codeError = '';
    this.roomCode = '';
    this.pendingCode = code;
    this.rec = null;
    this.idx = 0;
    Exam.data = null;
    if (!quiet) {
      this.checking = true;
      this.screen = 'lock';
      this.render();
    }

    FB.get(DB_PATH.exam(code), function (err, data) {
      self.checking = false;
      if (err) {
        self.offline = true;
        self.ready = true;
        self.screen = 'offline';
        self.render();
        return;
      }
      if (!data || typeof data !== 'object') {
        LS.del(KEYS.memberRoom);
        self.toLock(ROOM_CODE_ERROR);
        return;
      }
      self.roomCode = code;
      LS.set(KEYS.memberRoom, code);
      self.updateUrl(code);
      Exam.load(data);
      self.examStatus = Exam.status();
      self.examSig = self.sigOfExam();
      self.subscribeExam();
      self.loadOwn(function () {
        self.ready = true;
        self.decide();
        self.render();
      });
    });
  },

  retry: function () {
    var code = this.pendingCode || RoomCode.normalize(getParam('code') || LS.get(KEYS.memberRoom) || '');
    if (code) { this.enterRoom(code); }
    else { this.toLock(''); }
  },

  /* 방을 떠나고 새 코드를 받을 수 있게 한다. */
  resetRoom: function () {
    this.stopSub();
    LS.del(KEYS.memberRoom);
    if (this.rec) { LS.del(this.draftKey()); }
    this.updateUrl('');
    this.toLock('');
  },

  updateUrl: function (code) {
    try {
      var loc = window.location || {};
      var hist = window.history;
      var href = String(loc.href || '');
      if (!href || !hist || typeof hist.replaceState !== 'function') { return; }
      var base = href.split('#')[0].split('?')[0];
      hist.replaceState(null, '', code ? withCode(base, code) : base);
    } catch (e) { /* 주소를 못 바꿔도 입장에는 영향이 없다 */ }
  },

  draftKey: function () { return KEYS.draft + (this.roomCode || 'noroom') + ':' + this.myId; },

  loadOwn: function (cb) {
    var self = this;
    FB.get(DB_PATH.participant(this.roomCode, this.myId), function (err, data) {
      if (err) {
        var draft = LS.getJSON(self.draftKey());
        if (draft && draft.id) { self.rec = draft; }
      } else {
        self.rec = (data && data.id) ? data : null;
        if (self.rec) { LS.setJSON(self.draftKey(), self.rec); }
      }
      cb();
    });
  },

  subscribeExam: function () {
    var self = this;
    this.stopSub();
    if (!this.roomCode) { return; }
    this.subExam = FB.subscribe(DB_PATH.exam(this.roomCode), function (d) { self.onExam(d); });
  },

  onExam: function (data) {
    if (!data) {
      /* 방이 지워졌다 = 출제자가 코드를 바꿨거나 방을 정리했다. */
      if (this.ready && this.roomCode) {
        this.stopSub();
        this.rec = null;
        this.screen = 'gone';
        this.render();
      }
      return;
    }
    if (!(data.questions instanceof Array) || !data.questions.length) {
      if (this.ready) { this.screen = 'empty'; this.render(); }
      return;
    }
    this.offline = false;
    var prevStatus = this.examStatus;
    var prevSig = this.examSig;
    Exam.load(data);
    this.examStatus = Exam.status();
    var sig = this.sigOfExam();
    this.examSig = sig;

    /* 출제자가 응답을 초기화하면 라운드가 바뀐다 — 옛 기록을 버리고 다시 참여하게 한다. */
    if (this.rec && (Number(this.rec.round) || 1) !== ((Exam.data.round) || 1)) {
      this.rec = null;
      this.idx = 0;
      LS.del(this.draftKey());
      toast('출제자가 응시를 초기화했습니다. 다시 참여해 주세요.', 'warn');
    }

    if (prevStatus === 'running' && this.examStatus === 'waiting') {
      this.syncOwn(true);
    }
    if (this.screen === 'quiz' && this.examStatus === 'ended') {
      this.submit(true);
      return;
    }
    if (this.screen === 'quiz' && this.examStatus === 'waiting') {
      this.screen = 'wait';
      this.render();
      return;
    }
    if (prevSig === sig && prevStatus === this.examStatus) {
      /* 제목·제한시간 표시만 바뀐 경우: 응시 중이 아니면 화면을 다시 그린다. */
      if (this.screen !== 'quiz') { this.render(); }
      return;
    }
    this.decide();
    this.render();
  },

  sigOfExam: function () {
    var ex = Exam.data;
    if (!ex) { return ''; }
    var ids = [];
    for (var i = 0; i < ex.questions.length; i++) { ids.push(ex.questions[i].id); }
    return [ex.status, (Number(ex.round) || 1), ex.questions.length, ids.join(',')].join('|');
  },

  decide: function () {
    var ex = Exam.data;
    if (!ex || !ex.questions || !ex.questions.length) {
      this.screen = this.offline ? 'offline' : 'empty';
      return;
    }
    var st = Exam.status();
    var rec = this.rec;
    if (rec && (Number(rec.round) || 1) !== ((ex.round) || 1)) { rec = null; this.rec = null; }
    if (!rec) { this.screen = (st === 'ended') ? 'closed' : 'join'; return; }
    if (rec.status === 'submitted') { this.screen = 'done'; return; }
    if (st === 'running') {
      if (rec.status !== 'answering') {
        rec.status = 'answering';
        if (!rec.startedAt) { rec.startedAt = now(); }
        this.putOwn();
      }
      this.idx = clampIdx(rec.index || 0, ex.questions.length);
      this.screen = 'quiz';
      return;
    }
    if (st === 'ended') {
      this.submit(true, true);
      return;
    }
    this.screen = 'wait';
  },

  /* ---------------------------------------------------------- 참여 */
  join: function (name) {
    var nm = String(name || '').replace(/\s+/g, ' ').trim().slice(0, 20);
    if (!nm) { toast('이름을 입력해 주세요.', 'warn'); return; }
    var ex = Exam.data;
    if (!ex || !ex.questions || !ex.questions.length) { toast('아직 문제가 준비되지 않았습니다.', 'warn'); return; }
    var rec = this.rec || Model.blankRecord(this.myId, nm, ex);
    rec.id = this.myId;
    rec.name = nm;
    rec.joinedAt = rec.joinedAt || now();
    rec.lastSeen = now();
    rec.maxScore = Exam.totalPoints();
    rec.round = (Number(ex.round) || 1);
    if (!rec.answers) { rec.answers = {}; }
    LS.set(KEYS.name, nm);
    if (Exam.status() === 'running') {
      rec.status = 'answering';
      rec.startedAt = rec.startedAt || now();
      this.rec = rec;
      this.idx = clampIdx(rec.index || 0, ex.questions.length);
      this.screen = 'quiz';
    } else {
      rec.status = 'waiting';
      this.rec = rec;
      this.screen = 'wait';
    }
    this.putOwn();
    this.render();
  },

  putOwn: function (cb) {
    if (!this.rec || !this.roomCode) { return; }
    /* 출제자가 대기로 되돌리거나 초기화한 뒤에는 응시 기록을 되살리지 않는다. */
    if (this.rec.status === 'answering' && Exam.status() !== 'running') { return; }
    if ((Number(this.rec.round) || 1) !== ((Exam.data && Exam.data.round) || 1)) { return; }
    var self = this;
    this.rec.lastSeen = now();
    this.rec.maxScore = Exam.totalPoints();
    LS.setJSON(this.draftKey(), this.rec);
    FB.put(DB_PATH.participant(this.roomCode, this.myId), this.rec, function (err) {
      self.lastPut = now();
      if (err) { self.pendingPut = true; return; }
      self.pendingPut = false;
      if (cb) { cb(); }
    });
  },

  queueSave: function () {
    var self = this;
    if (!this.saveTimer) {
      this.saveTimer = debounce(function () { self.saveTimer = null; self.putOwn(); }, 300);
    }
    this.saveTimer();
  },

  syncOwn: function (force) {
    var self = this;
    if (!this.rec || !this.roomCode) { return; }
    if (!force && now() - this.lastPut < 6000) { return; }
    if (!force && now() - this.lastSync < 8000) { return; }
    this.lastSync = now();
    FB.get(DB_PATH.participant(this.roomCode, this.myId), function (err, data) {
      if (err) { return; }
      var exists = !!(data && data.id);
      if (exists && (Number(data.round) || 1) !== ((Exam.data && Exam.data.round) || 1)) { exists = false; }
      if (!exists) {
        self.rec = null;
        self.idx = 0;
        LS.del(self.draftKey());
        self.decide();
        self.render();
        toast('출제자가 응시를 초기화했습니다. 다시 참여해 주세요.', 'warn');
        return;
      }
      var changed = !self.rec || data.status !== self.rec.status ||
        (data.submittedAt || 0) !== (self.rec.submittedAt || 0);
      if (changed && (data.status === 'submitted' || data.status === 'waiting' || data.status === 'answering')) {
        if (self.rec && self.rec.status === 'submitted') { return; }
        self.rec = data;
        self.decide();
        self.render();
      }
    });
  },

  /* ---------------------------------------------------------- 렌더 */
  render: function () {
    var root = $('memberRoot');
    if (!root) { return; }
    if (this.screen !== 'lock' && this.screen !== 'loading' && Exam.data) { paintBrandTitle(Exam.data.title); }
    if (this.screen === 'quiz') { this.renderQuiz(); return; }
    clearNode(root);
    if (this.screen === 'wait') { this.renderWait(); }
    else if (this.screen === 'done') { this.renderDone(); }
    else if (this.screen === 'closed') { this.renderClosed(); }
    else if (this.screen === 'empty') { this.renderEmpty(); }
    else if (this.screen === 'gone') { this.renderGone(); }
    else if (this.screen === 'offline') { this.renderOffline(); }
    else if (this.screen === 'lock') { this.renderLock(); }
    else { this.renderJoin(); }
  },

  /* 초대 코드 입력 화면 — 코드가 맞기 전에는 시험 내용을 한 글자도 보여주지 않는다. */
  renderLock: function () {
    var self = this;
    var root = $('memberRoot');
    var codeIn = el('input', {
      cls: 'input', type: 'text', value: this.pendingCode || '',

      attrs: {
        maxlength: '24', placeholder: '예) EXQ-1A2B3C', 'aria-label': '초대 코드',
        'data-role': 'room-code-input', autocomplete: 'off', autocapitalize: 'characters', spellcheck: 'false'
      }
    });
    codeIn.addEventListener('keydown', function (ev) {
      if (ev && (ev.key === 'Enter' || ev.keyCode === 13)) { self.submitCode(codeIn.value); }
    });
    var kids = [
      el('span', { cls: 'm-step', text: '🔒 비공개 시험' }),
      el('h2', { cls: 'm-title', style: { marginTop: '10px' }, text: '초대 코드를 입력해 주세요' }),
      el('p', { cls: 'm-sub', text: '출제자에게 받은 초대 코드를 입력해야 시험에 입장할 수 있습니다.' }),
      el('div', { cls: 'join-form' }, [
        el('div', { cls: 'field' }, [
          el('span', { cls: 'label', text: '초대 코드' }),
          codeIn
        ]),
        el('div', { style: { marginTop: '12px' } }, [
          btn(this.checking ? '확인 중…' : '입장하기', 'btn btn-primary btn-lg btn-block',
            function () { self.submitCode(codeIn.value); },
            { attrs: { 'data-role': 'room-enter' }, disabled: this.checking })
        ])
      ])
    ];
    if (this.codeError) {
      kids.push(el('p', { cls: 'errline', style: { marginTop: '12px' }, text: this.codeError }));
    }
    kids.push(el('p', { cls: 'hintline', style: { marginTop: '14px' }, text: '초대 링크로 들어오면 코드를 입력하지 않아도 됩니다. 코드는 대소문자 구분 없이 입력할 수 있습니다.' }));
    root.appendChild(el('div', { cls: 'm-card' }, [el('div', { cls: 'm-pad' }, kids)]));
  },

  submitCode: function (raw) {
    if (this.checking) { return; }
    var code = RoomCode.normalize(raw);
    if (!code) { this.toLock('초대 코드를 입력해 주세요.'); return; }
    this.enterRoom(code);
  },

  renderGone: function () {
    var root = $('memberRoot');
    root.appendChild(el('div', { cls: 'm-card' }, [
      el('div', { cls: 'm-pad' }, [
        el('span', { cls: 'm-step', text: '방이 닫혔습니다' }),
        el('h2', { cls: 'm-title', style: { marginTop: '10px' }, text: '이 초대 코드로는 입장할 수 없습니다' }),
        el('p', { cls: 'm-sub', text: '출제자가 초대 코드를 바꿨거나 시험 방을 정리했습니다. 새 초대 코드를 받아 다시 입장해 주세요.' }),
        el('div', { style: { marginTop: '14px' } }, [
          btn('초대 코드 다시 입력', 'btn btn-primary', function () { Member.resetRoom(); }, { attrs: { 'data-role': 'change-code' } })
        ])
      ])
    ]));
  },

  renderJoin: function () {
    var self = this;
    var root = $('memberRoot');
    var ex = Exam.data;
    if (!ex) { this.renderOffline(); return; }
    var prefill = getParam('name') || LS.get(KEYS.name) || '';
    var nameIn = el('input', {
      cls: 'input', type: 'text', value: prefill,
      attrs: { maxlength: '20', placeholder: '이름을 입력하세요', 'aria-label': '이름', 'data-role': 'join-name', autocomplete: 'name' }
    });
    nameIn.addEventListener('keydown', function (ev) {
      if (ev && (ev.key === 'Enter' || ev.keyCode === 13)) { self.join(nameIn.value); }
    });
    var statusTag = ex.status === 'running' ? tagNode('지금 진행 중', 'tag-ox') : tagNode(STATUS_LABEL[ex.status], '');

    root.appendChild(el('div', { cls: 'm-card' }, [
      el('div', { cls: 'm-pad' }, [
        el('span', { cls: 'm-step', text: '참여하기' }),
        el('h2', { cls: 'm-title', style: { marginTop: '10px' }, text: String(ex.title || APP_NAME) }),
        el('p', { cls: 'm-sub', text: '이름을 입력하고 참여하면 문제가 열립니다. 결과는 본인 것만 보입니다.' }),
        el('div', { cls: 'm-meta' }, [
          tagNode(ex.questions.length + '문항'),
          tagNode(Exam.totalPoints() + '점 만점'),
          tagNode(ex.timeLimitMin > 0 ? '제한시간 ' + ex.timeLimitMin + '분' : '제한시간 없음'),
          statusTag
        ]),
        el('div', { cls: 'join-form' }, [
          el('div', { cls: 'field' }, [el('span', { cls: 'label', text: '이름' }), nameIn]),
          el('div', { style: { marginTop: '12px' } }, [
            btn('참여하기', 'btn btn-primary btn-lg btn-block', function () { self.join(nameIn.value); }, { attrs: { 'data-role': 'join' } })
          ])
        ]),
        el('p', { cls: 'hintline', style: { marginTop: '14px' }, text: '내 점수와 답안은 나에게만 보입니다. 화면을 새로고침해도 이어서 볼 수 있습니다.' })
      ])
    ]));
  },

  renderWait: function () {
    var root = $('memberRoot');
    var ex = Exam.data;
    var rec = this.rec;
    root.appendChild(el('div', { cls: 'm-card' }, [
      el('div', { cls: 'wait' }, [
        el('div', { cls: 'wait-orb' }),
        el('h2', { text: (rec && rec.name ? rec.name + '님, ' : '') + '준비되었습니다' }),
        el('p', { text: '출제자가 시험을 시작하면 문제가 자동으로 열립니다. 이 화면을 그대로 두셔도 됩니다.' }),
        el('div', { cls: 'm-meta', style: { justifyContent: 'center' } }, [
          tagNode(STATUS_LABEL[ex.status]),
          tagNode(ex.questions.length + '문항'),
          tagNode(ex.timeLimitMin > 0 ? '제한시간 ' + ex.timeLimitMin + '분' : '제한시간 없음')
        ])
      ]),
      el('div', { cls: 'card-foot', style: { justifyContent: 'center' } }, [
        btn('상태 새로고침', 'btn btn-sm', function () {
          if (Member.subExam) { Member.subExam.fetchNow(); }
          Member.syncOwn(true);
          toast('상태를 확인했습니다.', 'ok');
        })
      ])
    ]));
  },

  /* ---------------------------------------------------------- 응시 */
  renderQuiz: function () {
    var self = this;
    var root = $('memberRoot');
    clearNode(root);
    var ex = Exam.data;
    var qs = ex.questions || [];
    if (!qs.length) { this.screen = 'empty'; this.renderEmpty(); return; }
    var idx = clampIdx(this.idx, qs.length);
    this.idx = idx;
    var q = qs[idx];
    var answers = (this.rec && this.rec.answers) || {};
    var cur = answers[q.id] ? answers[q.id].raw : null;
    var answeredCount = 0;
    for (var i = 0; i < qs.length; i++) {
      var a = answers[qs[i].id];
      if (a && !Model.isBlank(a.raw)) { answeredCount++; }
    }

    this.timerEl = el('span', { cls: 'timer', text: '--:--' });
    this.optRefs = [];
    this.dotRefs = [];
    var isLast = idx === qs.length - 1;

    var dots = el('div', { cls: 'dots' });
    for (var d = 0; d < qs.length; d++) {
      (function (d) {
        var a2 = answers[qs[d].id];
        var isAns = a2 && !Model.isBlank(a2.raw);
        var node = el('button', {
          cls: 'dot-btn' + (isAns ? ' is-ans' : '') + (d === idx ? ' is-cur' : ''),
          type: 'button', text: String(d + 1),
          attrs: { 'aria-label': (d + 1) + '번 문항으로' }
        });
        node.addEventListener('click', function () { self.go(d); });
        dots.appendChild(node);
        self.dotRefs.push(node);
      })(d);
    }

    var progressCard = el('div', { cls: 'm-card' }, [
      el('div', { cls: 'm-pad', style: { paddingBottom: '14px' } }, [
        el('div', { cls: 'q-top' }, [
          el('span', { cls: 'q-count' }, [el('b', { text: String(idx + 1) }), ' / ' + qs.length]),
          el('span', { cls: 'tag ' + (TYPE_TAG[q.type] || ''), text: TYPE_LABEL[q.type] || q.type }),
          el('span', { cls: 'tag tag-pts', text: (Number(q.points) || 0) + '점' }),
          this.timerEl,
          isLast ? null : btn('제출', 'btn btn-ghost btn-sm', function () { self.confirmSubmit(); }, { attrs: { 'data-role': 'early-submit' } })
        ]),
        el('div', { cls: 'qprog' }, [
          el('div', { cls: 'qprog-track' }, [
            el('div', { cls: 'qprog-fill', style: { width: Math.round((answeredCount / qs.length) * 100) + '%' } })
          ])
        ]),
        el('div', { cls: 'psub', text: answeredCount + ' / ' + qs.length + ' 문항 응답' }),
        dots
      ])
    ]);

    var ansWrap = el('div');
    if (q.type === 'mcq') {
      var choices = q.choices || [];
      for (var c = 0; c < choices.length; c++) {
        if (!String(choices[c] || '').trim()) { continue; }
        (function (ci) {
          var sel = String(cur) === String(ci);
          var node = el('button', {
            cls: 'opt' + (sel ? ' is-sel' : ''), type: 'button',
            attrs: { 'aria-label': (ci + 1) + '번 보기', 'data-role': 'opt-' + ci }
          }, [
            el('span', { cls: 'opt-key', text: CIRCLED[ci] || String(ci + 1) }),
            el('span', { cls: 'opt-text', rich: String(choices[ci]) })
          ]);
          node.addEventListener('click', function () { self.setAnswer(ci); });
          ansWrap.appendChild(node);
          self.optRefs.push({ raw: String(ci), node: node });
        })(c);
      }
    } else if (q.type === 'ox') {
      var ox = el('div', { cls: 'oxwrap' });
      var vals = [['O', '맞다'], ['X', '아니다']];
      for (var o = 0; o < vals.length; o++) {
        (function (v, sub) {
          var sel = String(cur == null ? '' : cur).toUpperCase() === v;
          var node = el('button', { cls: 'oxbtn' + (sel ? ' is-sel' : ''), type: 'button', attrs: { 'data-role': 'ox-' + v } }, [
            v, el('small', { text: sub })
          ]);
          node.addEventListener('click', function () { self.setAnswer(v); });
          ox.appendChild(node);
          self.optRefs.push({ raw: v, node: node });
        })(vals[o][0], vals[o][1]);
      }
      ansWrap.appendChild(ox);
    } else {
      var input = el('input', {
        cls: 'shortin', type: 'text', value: cur == null ? '' : String(cur),
        attrs: { placeholder: '정답을 입력하세요', 'aria-label': '정답', maxlength: '100', autocomplete: 'off', 'data-role': 'short-input' }
      });
      input.addEventListener('input', function () { self.setAnswer(input.value); });
      ansWrap.appendChild(input);
      ansWrap.appendChild(el('p', { cls: 'short-hint', text: '대소문자와 띄어쓰기는 채점에서 자동으로 맞춰 봅니다. (출제자 설정에 따름)' }));
    }

    var nav = el('div', { cls: 'm-nav' }, [
      btn('이전', 'btn', function () { self.go(idx - 1); }, { disabled: idx === 0 }),
      isLast
        ? btn('제출하기', 'btn btn-ok btn-next', function () { self.confirmSubmit(); }, { attrs: { 'data-role': 'submit' } })
        : btn('다음', 'btn btn-primary btn-next', function () { self.go(idx + 1); }, { attrs: { 'data-role': 'next' } })
    ]);

    var qCard = el('div', { cls: 'm-card' }, [
      el('div', { cls: 'm-pad' }, [
        el('div', { cls: 'q-body', rich: q.text }),
        ansWrap,
        nav
      ])
    ]);

    root.appendChild(el('div', { cls: 'psub', style: { marginBottom: '10px' }, text: (this.rec && this.rec.name ? this.rec.name + '님' : '') + ' 응시 중' }));
    root.appendChild(progressCard);
    root.appendChild(qCard);
    root.appendChild(el('p', { cls: 'hintline', style: { textAlign: 'center' }, text: '답안은 자동으로 저장됩니다. 화면을 새로고침해도 이어서 풀 수 있습니다.' }));

    this.updateTimer();
  },

  go: function (i) {
    var qs = (Exam.data && Exam.data.questions) || [];
    if (i < 0 || i > qs.length - 1) { return; }
    this.idx = i;
    if (this.rec) {
      this.rec.index = i;
      this.putOwn();
    }
    this.renderQuiz();
  },

  setAnswer: function (raw) {
    if (!this.rec) { return; }
    var q = (Exam.data.questions || [])[this.idx];
    if (!q) { return; }
    if (!this.rec.answers) { this.rec.answers = {}; }
    if (Model.isBlank(raw)) { delete this.rec.answers[q.id]; }
    else { this.rec.answers[q.id] = { raw: raw, at: now() }; }
    this.paintSel();
    this.paintDots();
    this.queueSave();
  },

  paintSel: function () {
    var q = (Exam.data.questions || [])[this.idx];
    if (!q || !this.rec) { return; }
    var a = this.rec.answers && this.rec.answers[q.id];
    var raw = a ? a.raw : null;
    for (var i = 0; i < this.optRefs.length; i++) {
      var ref = this.optRefs[i];
      var on = q.type === 'ox'
        ? String(raw == null ? '' : raw).toUpperCase() === String(ref.raw).toUpperCase()
        : String(raw) === String(ref.raw);
      ref.node.className = ref.node.className.replace(/ is-sel/g, '') + (on ? ' is-sel' : '');
    }
  },

  paintDots: function () {
    var qs = (Exam.data && Exam.data.questions) || [];
    var answers = (this.rec && this.rec.answers) || {};
    for (var i = 0; i < this.dotRefs.length && i < qs.length; i++) {
      var a = answers[qs[i].id];
      var isAns = a && !Model.isBlank(a.raw);
      this.dotRefs[i].className = 'dot-btn' + (isAns ? ' is-ans' : '') + (i === this.idx ? ' is-cur' : '');
    }
  },

  updateTimer: function () {
    if (!this.timerEl) { return; }
    var rem = Exam.remaining();
    if (rem === null) { this.timerEl.textContent = '시간 정보 없음'; this.timerEl.className = 'timer is-none'; return; }
    if (rem < 0) { this.timerEl.textContent = '제한시간 없음'; this.timerEl.className = 'timer is-none'; return; }
    this.timerEl.textContent = fmtClock(rem);
    this.timerEl.className = 'timer' + (rem <= 60000 ? ' is-urgent' : '');
  },

  confirmSubmit: function () {
    var self = this;
    var ev = Model.evaluate(Exam.data, this.rec || {});
    confirmAsk({
      title: '제출할까요?',
      body: ev.missing
        ? '미응답 ' + ev.missing + '문항이 있습니다. 제출 후에는 답을 바꿀 수 없습니다.'
        : '제출 후에는 답을 바꿀 수 없습니다.',
      okLabel: '제출'
    }, function () { self.submit(false); });
  },

  submit: function (auto, silent) {
    if (!this.rec) { return; }
    if (this.rec.status === 'submitted') {
      if (!silent) { this.screen = 'done'; this.render(); }
      return;
    }
    var g = Model.grade(Exam.data, this.rec);
    this.rec.status = 'submitted';
    this.rec.submittedAt = now();
    this.rec.auto = !!auto;
    this.rec.score = g.score;
    this.rec.maxScore = g.maxScore;
    this.rec.correctCount = g.correctCount;
    this.rec.durationSec = g.durationSec;
    this.rec.index = (Exam.data.questions || []).length;
    this.screen = 'done';
    this.putOwn();
    if (!silent) {
      this.render();
      var msg = '시간이 끝나 자동 제출되었습니다.';
      if (Exam.status() === 'ended') { msg = '시험이 종료되어 지금까지의 답안으로 자동 제출되었습니다.'; }
      toast(auto ? msg : '제출했습니다. 내 결과만 표시됩니다.', auto ? 'warn' : 'ok');
    }
  },

  /* ---------------------------------------------------------- 결과 */
  renderDone: function () {
    var root = $('memberRoot');
    var ex = Exam.data;
    var rec = this.rec || {};
    var ev = Model.evaluate(ex, rec);
    var ended = Exam.status() === 'ended';

    var titleBits = [el('span', { text: '제출 완료' })];
    if (rec.auto) { titleBits.push(tagNode('자동 제출', '')); }

    var head = el('div', { cls: 'score-hero' }, [
      el('div', { cls: 'score-num' }, [el('b', { text: String(ev.earned) }), el('span', { text: '/ ' + ev.max + '점' })]),
      el('div', { cls: 'score-meta' }, [
        el('div', { cls: 'score-title' }, titleBits),
        el('div', { cls: 'res-chips' }, [
          el('span', { cls: 'res-chip' }, ['정답 ', el('b', { text: String(ev.correct) })]),
          el('span', { cls: 'res-chip' }, ['오답 ', el('b', { text: String(ev.wrong) })]),
          el('span', { cls: 'res-chip' }, ['미응답 ', el('b', { text: String(ev.missing) })]),
          el('span', { cls: 'res-chip' }, ['소요 ', el('b', { text: fmtDuration(ev.elapsed) })]),
          el('span', { cls: 'res-chip' }, ['정답률 ', el('b', { text: ev.correctRate + '%' })])
        ])
      ])
    ]);

    var card = el('div', { cls: 'm-card' }, [
      head,
      el('div', { cls: 'privacy-note' }, [
        el('i', { text: '✓' }),
        el('span', { text: '내 결과만 표시됩니다. 다른 팀원의 점수·순위·답안은 이 화면에 나오지 않습니다.' })
      ])
    ]);

    if (!ended) {
      card.appendChild(el('div', { cls: 'locked-answers', text: '정답과 해설은 출제자가 시험을 끝낸 뒤 공개됩니다.' }));
    }

    var listWrap = el('div', { style: { marginTop: '14px' } });
    for (var i = 0; i < ev.items.length; i++) {
      var it = ev.items[i];
      var q = it.q;
      var cls = it.correct ? 'rev rev-ok' : (it.answered ? 'rev rev-no' : 'rev rev-miss');
      var mark = it.correct ? '✓' : (it.answered ? '✕' : '–');
      var kids = [
        el('div', { cls: 'rev-head' }, [
          el('span', { cls: 'rev-mark', text: mark }),
          el('div', { cls: 'rev-q', rich: (i + 1) + '. ' + q.text }),
          el('span', { cls: 'rev-pts', text: it.earned + '/' + it.points })
        ]),
        el('div', { cls: 'kv' }, [
          el('div', null, [el('span', { cls: 'k', text: '내 답' }), el('span', { cls: it.correct ? 'right' : (it.answered ? 'wrong' : 'mine'), rich: it.answered ? Model.answerText(q, it.raw) : '미응답' })])
        ].concat(ended ? [el('div', null, [el('span', { cls: 'k', text: '정답' }), el('span', { cls: 'right', rich: Model.correctText(q) })])] : []))
      ];
      if (ended && q.explain) { kids.push(el('div', { cls: 'explain', rich: q.explain })); }
      listWrap.appendChild(el('div', { cls: cls }, kids));
    }

    var reviewCard = el('div', { cls: 'm-card' }, [
      el('div', { cls: 'card-head' }, [
        el('h2', { text: '문항별 리뷰' }),
        el('span', { cls: 'hint', text: ended ? '정답과 해설이 공개되었습니다' : '정답은 시험 종료 후 공개' })
      ]),
      listWrap
    ]);

    root.appendChild(card);
    root.appendChild(reviewCard);
    root.appendChild(el('p', { cls: 'hintline', style: { textAlign: 'center' }, text: ended ? '시험이 종료되었습니다. 수고하셨습니다.' : '시험이 진행 중입니다. 출제자가 끝내면 정답과 해설이 이 화면에 나타납니다.' }));
  },

  renderClosed: function () {
    var root = $('memberRoot');
    var ex = Exam.data || { questions: [] };
    root.appendChild(el('div', { cls: 'm-card' }, [
      el('div', { cls: 'm-pad' }, [
        el('span', { cls: 'm-step', text: '참여할 수 없습니다' }),
        el('h2', { cls: 'm-title', style: { marginTop: '10px' }, text: '시험이 종료되었습니다' }),
        el('p', { cls: 'm-sub', text: '지금은 참여할 수 없습니다. 결과는 출제자에게 문의해 주세요.' }),
        el('div', { cls: 'm-meta' }, [tagNode(STATUS_LABEL.ended), tagNode((ex.questions || []).length + '문항')])
      ])
    ]));
  },

  renderEmpty: function () {
    var root = $('memberRoot');
    root.appendChild(el('div', { cls: 'm-card' }, [
      el('div', { cls: 'm-pad' }, [
        el('h2', { cls: 'm-title', text: '아직 문제가 없습니다' }),
        el('p', { cls: 'm-sub', text: '출제자가 문항을 준비하고 있습니다. 잠시 후 다시 확인해 주세요.' }),
        el('div', { style: { marginTop: '14px' } }, [
          btn('초대 코드 다시 입력', 'btn btn-sm', function () { Member.resetRoom(); }, { attrs: { 'data-role': 'change-code' } })
        ])
      ])
    ]));
  },

  renderOffline: function () {
    var root = $('memberRoot');
    root.appendChild(el('div', { cls: 'm-card' }, [
      el('div', { cls: 'm-pad' }, [
        el('h2', { cls: 'm-title', text: '연결되지 않았습니다' }),
        el('p', { cls: 'm-sub', text: '네트워크 연결을 확인해 주세요. 연결되면 자동으로 다시 불러옵니다.' }),
        el('div', { style: { marginTop: '14px' } }, [
          btn('다시 시도', 'btn btn-primary', function () { Member.retry(); }),
          btn('초대 코드 다시 입력', 'btn btn-sm', function () { Member.resetRoom(); }, { attrs: { 'data-role': 'change-code' } })
        ])
      ])
    ]));
  },

  /* ---------------------------------------------------------- 틱 */
  tick: function () {
    if (this.screen === 'offline' && this.pendingCode && now() - this.lastRetry > 3000) {
      this.lastRetry = now();
      this.enterRoom(this.pendingCode, true);
      return;
    }
    if (!this.ready) { return; }
    if (this.screen === 'quiz') {
      this.updateTimer();
      var rem = Exam.remaining();
      if (rem === 0) { this.submit(true); return; }
    }
    if (this.pendingPut && now() - this.lastPut > 3000) { this.putOwn(); }
    if (this.rec && this.roomCode && (this.screen === 'quiz' || this.screen === 'wait' || this.screen === 'done')) {
      this.syncOwn(false);
    }
  }
};

/* 팀원 응시 화면 시작 */
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', function () { Member.init(); });
} else {
  Member.init();
}

/* 검증·디버깅용 핸들: ?dev=1 또는 테스트 플래그가 있을 때만 노출한다. */
if (window.__TQ_TEST === true || getParam('dev') === '1') {
  window.__TQ = { Member: Member, Exam: Exam, Model: Model, FB: FB, LS: LS, KEYS: KEYS, toast: toast, Modal: Modal };
}
</script>
</body>
</html>
